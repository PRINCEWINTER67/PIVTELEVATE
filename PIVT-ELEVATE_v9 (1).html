                                        <button onClick={sendForgotOtp} disabled={otpSending} className={`w-full py-3 rounded-xl font-bold bg-gradient-to-r from-indigo-500 to-cyan-500 hover:opacity-90 transition-all transform hover:scale-105 shadow-lg ${otpSending?'opacity-60 cursor-not-allowed scale-100':''}`}>{otpSending?'📤 Sending OTP...':'📧 Send OTP to Email'}</button>
                                        <div><label className="block text-sm text-gray-400 mb-2">OTP Code</label><input type="text" maxLength="6" value={authForm.otp||''} onChange={(e)=>setAuthForm({...authForm,otp:e.target.value.replace(/\D/g,'')})} className="w-full bg-gray-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-500 tracking-[0.35em] text-center font-bold" placeholder="000000"/></div>
                                        <div><label className="block text-sm text-gray-400 mb-2">New Password</label><div className="relative"><div className="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-500"><Lock/></div><input type={showPass?'text':'password'} value={authForm.password} onChange={(e)=>setAuthForm({...authForm,password:e.target.value})} onKeyPress={(e)=>e.key==='Enter'&&forgotPass()} className="w-full bg-gray-700 text-white pl-12 pr-12 py-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-500" placeholder="New secure password"/><button onClick={()=>setShowPass(!showPass)} className="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-gray-300">{showPass?<EyeOff/>:<Eye/>}</button></div></div>
                                        <div className="bg-gray-900 rounded-lg p-3 text-xs grid grid-cols-2 gap-2">
                                            {Object.entries(getPasswordChecklist(authForm.password)).map(([k,v])=><p key={k} className={v?'text-green-400':'text-gray-500'}>{v?'✅':'•'} {k==='length'?'8+ chars':k==='upper'?'Uppercase':k==='lower'?'Lowercase':'Number'}</p>)}
                                        </div>
                                        <button onClick={forgotPass} className="w-full py-4 rounded-xl font-bold text-lg bg-gradient-to-r from-cyan-500 to-blue-500 hover:opacity-90 transition-all transform hover:scale-105 shadow-lg">Verify OTP & Reset Password</button>
                                        <div className="text-center text-gray-500 text-sm">Remember password? <button onClick={()=>{setAuthMode('login');setAuthErr('');setResetMsg('');setForgotOtpMeta(null);setOtpModal(null);setAuthForm({username:'',email:'',password:'',confirmPassword:'',otp:''})}} className="text-cyan-400 hover:text-cyan-300">Login</button></div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            // MAIN GAME UI
            return(
                <>
                <div className={appTheme==='dark'?'dark':''}>
                <div className={`ui-shell ui-${uiProfile} adaptive-vh min-h-screen ${appTheme==='dark'?'bg-gradient-to-br from-gray-900 via-gray-800 to-black text-white':'bg-gradient-to-br from-blue-50 via-purple-50 to-pink-50 text-gray-900'} p-3 md:p-6 lg:p-8 transition-colors duration-300 safe-pad`} data-ui={uiProfile} data-theme={appTheme} style={{position:'relative'}}>
                    {/* ── GLOBAL THEME ACCENT BAR — thin gradient across the very top of the page ── */}
                    <div className={`fixed top-0 left-0 right-0 h-1 bg-gradient-to-r ${ctheme.p} ${ctheme.anim||''} z-[9999] pointer-events-none`}/>
                    {/* ── GLOBAL THEME GLOW — subtle ambient background tint ── */}
                    <div className={`fixed inset-0 pointer-events-none z-0 opacity-[0.04] bg-gradient-to-br ${ctheme.p}`}/>
                    {/* ── DELETE CONFIRM (habit/goal delete — replaces blocked window.confirm) ── */}
                    {deleteConfirm&&(
                        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.7)',zIndex:99998,display:'flex',alignItems:'center',justifyContent:'center',padding:'1rem'}}>
                            <div style={{background:'#1f2937',border:'1px solid #ef4444',borderRadius:'12px',padding:'1.5rem',minWidth:'300px',maxWidth:'440px',width:'100%',boxShadow:'0 25px 50px rgba(0,0,0,0.8)'}}>

                                    <button onClick={()=>setDeleteConfirm(null)} style={{background:'#374151',color:'#d1d5db',border:'1px solid #6b7280',borderRadius:'8px',padding:'0.5rem 1.25rem',cursor:'pointer',fontWeight:'bold'}}>Cancel</button>
                                    <button onClick={()=>{deleteConfirm.onConfirm();setDeleteConfirm(null);}} style={{background:'#ef4444',color:'white',border:'none',borderRadius:'8px',padding:'0.5rem 1.25rem',cursor:'pointer',fontWeight:'bold'}}>Delete</button>
                                </div>
                            </div>
                        </div>
                    )}
                    {/* ── ANIMATION QUEUE RENDERER (glitch-proof multi-reward floats) ── */}
                    {animQueue.map(a=>(
                        <div key={a.id}
                            className={a.size==='lg'?'animate-reward-float':'animate-reward-float-sm'}
                            style={{
                                position:'fixed',
                                top:`${a.y+(a.id%5)*22}%`, // stagger vertically by queue slot
                                left:`${a.x}%`,
                                zIndex:9999,
                                background:a.type==='coin'?'rgba(0,0,0,0.75)':'rgba(0,0,0,0.7)',
                                color:a.color,
                                padding:a.size==='lg'?'0.5rem 1.25rem':'0.35rem 0.875rem',
                                borderRadius:'999px',
                                fontWeight:'900',
                                fontSize:a.size==='lg'?'1.35rem':'1rem',
                                border:`2px solid ${a.color}60`,
                                boxShadow:`0 0 16px ${a.color}40`,
                                whiteSpace:'nowrap',
                                userSelect:'none',
                                letterSpacing:'0.02em',
                            }}
                        >{a.text}</div>
                    ))}
                    {/* ── TOAST NOTIFICATION SYSTEM ── */}
                    <div style={{position:'fixed',top:'1rem',right:'1rem',zIndex:10000,display:'flex',flexDirection:'column',gap:'0.5rem',maxWidth:'340px',width:'calc(100vw - 2rem)',pointerEvents:'none'}}>
                        {toastQueue.map(toast=>{
                            const colors={
                                info:{bg:'#1e40af',border:'#3b82f6',text:'#dbeafe'},
                                success:{bg:'#065f46',border:'#34d399',text:'#d1fae5'},
                                warning:{bg:'#78350f',border:'#f59e0b',text:'#fef3c7'},
                                error:{bg:'#7f1d1d',border:'#ef4444',text:'#fee2e2'},
                                prestige:{bg:'#4c1d95',border:'#a855f7',text:'#f3e8ff'},
                            };
                            const c=colors[toast.type]||colors.info;
                            return (
                                <div key={toast.id}
                                    className={toast.exiting?'animate-toast-out':'animate-toast-in'}
                                    onClick={()=>dismissToast(toast.id)}
                                    style={{
                                        background:c.bg,
                                        border:`1px solid ${c.border}`,
                                        color:c.text,
                                        padding:'0.75rem 1rem',
                                        borderRadius:'12px',
                                        fontSize:'0.82rem',
                                        lineHeight:'1.45',
                                        boxShadow:'0 4px 20px rgba(0,0,0,0.4)',

                                        pointerEvents:'all',

                                    {toast.message}
                                    <div style={{position:'absolute',top:'0.35rem',right:'0.5rem',color:c.border,fontSize:'0.75rem',opacity:0.7}}>✕</div>
                                </div>
                            );
                        })}
                    </div>
                    {showTierUp&&<div className="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-95 animate-fadeIn animate-screen-shake">
                        <div className="text-center animate-tier-explosion relative">
                            {/* Confetti stars */}
                            {[...Array(12)].map((_,i)=><div key={i} className="absolute animate-confetti pointer-events-none" style={{left:`${Math.random()*100}%`,top:`${Math.random()*30}%`,animationDelay:`${i*0.15}s`,fontSize:'1.5rem'}}>{['⭐','✨','💫','🌟','⚡','🎊'][i%6]}</div>)}
                            <div className={`text-9xl mb-4 animate-bounce animate-mega-flash animate-hue-rotate`}>{ct.icon}</div>
                            <h1 className={`text-8xl font-black mb-3 bg-gradient-to-r ${ct.color} bg-clip-text text-transparent animate-pulse animate-season-wave`}>MEGA TIER UP!</h1>
                            <p className="text-5xl font-bold mb-2 animate-neon-pulse">{ct.name}</p>
                            <p className="text-2xl text-yellow-300 animate-bounce">+500 Coins! 💰</p>
                            <div className="flex justify-center gap-3 mt-5">{[...Array(8)].map((_,i)=><div key={i} className="w-10 h-10 text-yellow-300 animate-star-burst" style={{animationDelay:`${i*0.1}s`}}><Star/></div>)}</div>
                        </div>
                    </div>}
                    {showLvlUp&&<div className="fixed inset-0 z-40 flex items-center justify-center pointer-events-none"><div className="text-center animate-scaleIn"><div className="w-32 h-32 text-yellow-400 mx-auto mb-4"><Zap/></div><h2 className="text-6xl font-bold text-yellow-400">LEVEL UP!</h2><p className="text-4xl mt-2">Level {lvl}</p><p className="text-xl text-yellow-400 mt-2">+50 Coins! 💰</p></div></div>}

                                <div className="text-9xl mb-8 animate-bounce animate-hue-rotate">

                                    {showSeasonComplete.oldSeason===2&&'✨'}
                                    {showSeasonComplete.oldSeason===3&&'⚡'}
                                    {showSeasonComplete.oldSeason===4&&'👑'}
                                    {showSeasonComplete.oldSeason===5&&'🌌'}

                                </h1>
                                <div className="text-3xl text-gray-300 mb-8 space-y-2">
                                    <p>━━━━━━━━━━━━━━━━━━━━</p>
                                    <p>Total XP: {showSeasonComplete.totalXp.toLocaleString()}</p>
                                    <p>Tasks Completed: {showSeasonComplete.tasks}</p>
                                    <p>Current Streak: {showSeasonComplete.streak} days</p>
                                    <p>━━━━━━━━━━━━━━━━━━━━</p>
                                </div>
                                <h2 className="text-7xl font-bold mb-6 bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-500 bg-clip-text text-transparent animate-glow">
                                    {showSeasonComplete.newSeason===2&&'🎉 SEASON 2: ASCENSION UNLOCKED!'}
                                    {showSeasonComplete.newSeason===3&&'🔥 SEASON 3: TRANSCENDENCE UNLOCKED!'}
                                    {showSeasonComplete.newSeason===4&&'👑 SEASON 4: DOMINATION UNLOCKED!'}
                                    {showSeasonComplete.newSeason===5&&'💫 SEASON 5: REVELATION UNLOCKED!'}

                                </div>

                        {showCustom&&<div className="bg-gray-800 rounded-2xl p-6 mb-6 border border-gray-700 animate-slideDown">

                            <div className="mb-6 bg-gray-700/50 rounded-xl p-4 border border-gray-600">
                                <h4 className="font-bold text-lg mb-4 flex items-center gap-2"><Trophy/><span>Progress Statistics</span></h4>
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
                                    <div className="bg-gray-800 p-3 rounded-xl text-center"><p className="text-2xl font-bold text-cyan-400">{stats.tasksCompleted}</p><p className="text-gray-400 text-xs">Tasks Done</p></div>

                                <div className="bg-gray-800 p-3 rounded-xl">
                                    <p className="font-bold text-sm mb-3 text-gray-300">Weekly Completed Tasks</p>

                                            const dateStr=date.toISOString().split('T')[0];
                                            const count=tasks.filter(t=>t.completed&&t.completedAt&&new Date(t.completedAt).toISOString().split('T')[0]===dateStr).length;

                                            </div>;
                                        })}
                                    </div>
                                </div>

                            <div className="mb-6">

                                <div className="grid grid-cols-5 md:grid-cols-10 gap-2">{allChars.map((c,i)=><button key={i} onClick={()=>setCharIdx(i)} className={`text-3xl p-3 rounded-xl transition-all transform hover:scale-110 ${charIdx===i?`bg-gradient-to-r ${ctheme.p} shadow-lg ring-2 ring-white`:'bg-gray-700 hover:bg-gray-600'}`}>{c}</button>)}</div>

                            <div className="mb-6">
                                <p className="text-sm font-bold text-gray-300 mb-3 uppercase tracking-wider">🎨 Themes</p>
                                {(()=>{
                                    const builtIn=themes.map((t,i)=>({...t,idx:i,minT:0}));
                                    const custom=customThemes.map((t,ci)=>({...t,idx:themes.length+ci,minT:t.minT||0}));
                                    const all=[...builtIn,...custom];
                                    // Group by tier band
                                    const bands=[
                                        {label:'🆓 Free',min:0,max:0},

                                    const bands=[
                                        {label:'Tier 1–5',min:0,max:5},

                                        {label:'Tier 16–30',min:16,max:30},
                                        {label:'Tier 31+',min:31,max:99},

                                    return bands.map(band=>{

                                <div className="grid grid-cols-2 gap-4 mb-4">
                                    <div><label className="text-sm text-gray-400 mb-2 block">Difficulty</label><select value={newTask.difficulty} onChange={(e)=>setNewTask({...newTask,difficulty:e.target.value})} className="w-full bg-gray-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-500">{Object.entries(diffs).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}</select></div>
                                    <div><label className="text-sm text-gray-400 mb-2 block">Duration</label><select value={newTask.duration} onChange={(e)=>setNewTask({...newTask,duration:e.target.value})} className="w-full bg-gray-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-500">{Object.entries(durs).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}</select></div>

                                                <div>

                                                    <p className={`font-bold ${appTheme==='dark'?'text-orange-400':'text-orange-600'}`}>{stats.currentStreak} days</p>
                                                </div>
                                                <div>
                                                    <p className={`text-sm ${appTheme==='dark'?'text-gray-400':'text-gray-600'}`}>Best Streak</p>
                                                    <p className={`font-bold ${appTheme==='dark'?'text-yellow-400':'text-yellow-600'}`}>{stats.longestStreak} days</p>

                                            >

                                            <button 
                                                onClick={logout} 
                                                className="w-full p-3 rounded-xl font-bold bg-gradient-to-r from-orange-500 to-red-500 hover:opacity-90 text-white transition-all flex items-center justify-center gap-2"

                                                <LogOut/> Logout

                                            <button onClick={deleteAcc} className="w-full p-3 rounded-xl font-bold bg-gradient-to-r from-red-700 to-red-900 hover:opacity-90 text-white transition-all">{deleteRequestAt?`Complete Account Delete (${Math.max(0,Math.ceil(((deleteRequestAt+86400000)-getTrustedTime())/3600000))}h)`:'Request Account Deletion (24h lock)'}</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}


                        {showSet&&<div className="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-80 p-4"><div className="adaptive-modal adaptive-card bg-gray-800 rounded-2xl p-8 max-w-2xl w-full border border-gray-700 animate-modal-slide animate-glow-ring max-h-screen overflow-y-auto scrollbar-hide"><h2 className="text-3xl font-bold mb-6 flex items-center gap-2"><Settings/><span>Settings</span></h2><div className="space-y-4 mb-6"><div className="bg-gray-700 rounded-xl p-4"><div className="flex items-center gap-3 mb-2"><User/><span className="text-gray-400 text-sm">Username</span></div><p className="text-xl font-bold">{user}</p></div><div className="bg-gray-700 rounded-xl p-4"><div className="flex items-center gap-3 mb-2"><Trophy/><span className="text-gray-400 text-sm">Progress</span></div><p className="text-xl font-bold">{ct.name} - Level {lvl}</p><p className="text-sm text-gray-400 mt-1">{coins.toLocaleString()} Coins 💰</p></div><div className="bg-gray-700 rounded-xl p-4"><div className="flex items-center gap-3 mb-2"><Star/><span className="text-gray-400 text-sm">Stats</span></div><p className="text-lg">{stats.tasksCompleted} tasks • {stats.currentStreak} day streak</p><p className="text-sm text-gray-400">Best: {stats.longestStreak} days</p></div><div className="bg-gray-700 rounded-xl p-4"><div className="flex items-center gap-3 mb-3"><Clock/><span className="text-gray-400 text-sm">Time Zone</span></div><p className="text-xs text-gray-400 mb-2">Current: <span className="text-cyan-300 font-bold">{getTimezoneClock().pretty} ({getTimezoneClock().shortZone})</span></p><select value={timeZone} onChange={(e)=>setTimeZone(e.target.value)} className="w-full bg-gray-800 border border-gray-600 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-2 focus:ring-cyan-500">{timeZoneChoices.map(tz=><option key={tz} value={tz}>{tz}</option>)}</select></div><div className="bg-gray-700 rounded-xl p-4"><div className="flex items-center gap-3 mb-2"><Clock/><span className="text-gray-400 text-sm">Activity Log ({(activityLog||[]).length} entries)</span></div><div className="max-h-48 overflow-y-auto scrollbar-hide space-y-2 mt-2">{(activityLog||[]).length===0?<p className="text-gray-500 text-sm">No activity yet</p>:(activityLog||[]).slice(0,20).map((log,i)=><div key={i} className="bg-gray-800 rounded p-2 text-xs"><p className="text-gray-400">{log.date||new Date(log.timestamp||0).toLocaleString()}</p><p className="text-white font-bold">{log.type==='task_completed'?`✅ ${log.details?.task||'Task'}`:log.type==='level_up'?`⬆️ Level ${log.details?.level}`:log.type==='tier_up'?`🌟 ${log.details?.tier}`:log.type}</p>{log.details?.xp&&<p className="text-yellow-400">+{log.details.xp} XP, +{log.details.coins||0} Coins</p>}</div>)}</div></div></div><div className="space-y-3"><button onClick={exportUserData} className="w-full py-3 rounded-xl font-bold bg-gradient-to-r from-blue-500 to-cyan-500 hover:opacity-90 transition-all flex items-center justify-center gap-2"><Star/><span>Export Data</span></button><button onClick={()=>document.getElementById('pivt-import-input').click()} className="w-full py-3 rounded-xl font-bold bg-gradient-to-r from-green-500 to-emerald-500 hover:opacity-90 transition-all flex items-center justify-center gap-2"><Zap/><span>Import Data</span></button><input id="pivt-import-input" type="file" accept=".json" onChange={importUserData} className="hidden"/><button onClick={logout} className="w-full py-3 rounded-xl font-bold bg-gradient-to-r from-orange-500 to-red-500 hover:opacity-90 transition-all flex items-center justify-center gap-2"><LogOut/><span>Logout</span></button><button onClick={deleteAcc} className="w-full py-3 rounded-xl font-bold bg-red-900 hover:bg-red-800 transition-all text-red-200">Delete Account</button><button onClick={()=>setShowSet(false)} className="w-full py-3 rounded-xl font-bold bg-gray-700 hover:bg-gray-600 transition-all">Close</button></div></div>}

                        {/* ── BANK MODAL ── */}

                </div>
                </div>
                </div>
                </div>
                </>
            );
        };
        // Expose Game to global scope — Babel standalone wraps text/babel scripts in its
        // own function scope, so `const Game` is NOT on window automatically.
        window.Game = Game;
    </script>
    <script>
        // ── ROBUST INITIALIZATION ────────────────────────────────────────────────────
        // Kept in a plain <script> (not text/babel) so it runs as native JS.
        // DOMContentLoaded fires BEFORE Babel finishes compiling JSX, so we cannot
        // rely on it alone. We use window 'load' as the primary trigger (fires after
        // all scripts including async Babel transforms complete), and fall back to a
        // 300 ms retry loop in case Babel is still processing on very slow connections.
        var _pivtRenderDone = false;
        var _initRetryCount = 0;
        var MAX_INIT_RETRIES = 50; // ~7.5 s max before showing error

        // ── LOADING PROGRESS HELPERS ──
        var loadingProgress = 0;
        function updateLoadingProgress(percent, message) {
            loadingProgress = Math.min(percent, 100);
            var progressBar = document.getElementById('loading-progress');
            var messageEl = document.getElementById('loading-message-text');
            if (progressBar) progressBar.style.width = loadingProgress + '%';
            if (messageEl && message) messageEl.textContent = message;
        }

        // Simulate progress until React takes over
        (function() {
            var messages = [
                "Initializing security systems...",
                "Loading game assets...",
                "Connecting to database...",
                "Preparing user interface...",
                "Finalizing setup..."
            ];
            var simProgress = 0;
            function simulateProgress() {
                if (_pivtRenderDone) return;
                var increment = Math.random() * 8 + 2; // slightly faster increments
                simProgress = Math.min(simProgress + increment, 95); // cap at 95, real finish sets 100
                var messageIndex = Math.min(Math.floor(simProgress / 20), messages.length - 1);
                updateLoadingProgress(simProgress, messages[messageIndex]);
                if (simProgress < 95) setTimeout(simulateProgress, 100 + Math.random() * 150);
            }
            setTimeout(simulateProgress, 200); // start simulation quickly
        })();

        // ── PERFORMANCE MONITORING ──
        window.addEventListener('load', function() {
            var perfData = performance.timing;
            if (perfData.loadEventEnd && perfData.navigationStart) {
                var pageLoadTime = perfData.loadEventEnd - perfData.navigationStart;
                console.log('Page load time:', pageLoadTime, 'ms');
            }
        });

        function hideLoadingOverlay() {
            var overlay = document.getElementById('loading-overlay');
            if (overlay) {
                overlay.style.transition = 'opacity 0.2s ease-out';
                overlay.style.opacity = '0';
                setTimeout(function() {
                    overlay.style.display = 'none';
                    document.body.style.backgroundColor = '';
                }, 200);
            }
        }

        function initializeGame() {
            if (_pivtRenderDone) return;
            var rootElement = document.getElementById('root');
            if (!rootElement) { console.error("Root element '#root' not found."); hideLoadingOverlay(); return; }

            // Use the pinned references captured before Botpress could overwrite window.React.
            // This guarantees the same React instance is used for both createElement (in JSX)
            // and createRoot (here), preventing the $$typeof Symbol mismatch (error #31).
            var _React = window.__pivtReact || window.React;
            var _ReactDOM = window.__pivtReactDOM || window.ReactDOM;

            if (typeof _ReactDOM === 'undefined' || typeof _React === 'undefined') {
                _initRetryCount++;
                if (_initRetryCount > MAX_INIT_RETRIES) {
                    console.error("React/ReactDOM failed to load after " + MAX_INIT_RETRIES + " retries.");
                    hideLoadingOverlay();
                    rootElement.innerHTML = '<div style="min-height:100vh;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;padding:2rem;font-family:sans-serif;text-align:center;"><div><h1 style="font-size:2rem;margin-bottom:1rem;color:#ef4444;">Load Error</h1><p style="margin-bottom:1rem;">React failed to load. Check your internet connection.</p><button onclick="location.reload()" style="margin-top:1rem;padding:0.75rem 1.5rem;background:#3b82f6;color:white;border:none;border-radius:0.5rem;cursor:pointer;">Reload Page</button></div></div>';
                    return;
                }
                console.warn("React/ReactDOM not ready. Retrying... (" + _initRetryCount + "/" + MAX_INIT_RETRIES + ")");
                updateLoadingProgress(Math.min(loadingProgress + 5, 70), "Loading React libraries...");
                setTimeout(initializeGame, 300);
                return;
            }

            if (typeof window.Game !== 'function') {
                _initRetryCount++;
                if (_initRetryCount > MAX_INIT_RETRIES) {
                    console.error("Game component did not compile after " + MAX_INIT_RETRIES + " retries.");
                    hideLoadingOverlay();
                    rootElement.innerHTML = '<div style="min-height:100vh;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;padding:2rem;font-family:sans-serif;text-align:center;"><div><h1 style="font-size:2rem;margin-bottom:1rem;color:#ef4444;">Compile Error</h1><p style="margin-bottom:1rem;">Game failed to initialize. Check the browser console (F12).</p><button onclick="location.reload()" style="margin-top:1rem;padding:0.75rem 1.5rem;background:#3b82f6;color:white;border:none;border-radius:0.5rem;cursor:pointer;">Reload Page</button></div></div>';
                    return;
                }
                console.warn("Game component not ready. Retrying... (" + _initRetryCount + "/" + MAX_INIT_RETRIES + ")");
                updateLoadingProgress(Math.min(loadingProgress + 5, 85), "Compiling game engine...");
                setTimeout(initializeGame, 50);
                return;
            }

            updateLoadingProgress(100, "Launching P.I.V.T...");
            _pivtRenderDone = true;
            _initRetryCount = 0;
            try {
                hideLoadingOverlay();
                rootElement.innerHTML = '';
                // React 18 createRoot — uses the same pinned _ReactDOM reference as the
                // Babel block's React, so both sides share the same $$typeof Symbol.
                var root = _ReactDOM.createRoot(rootElement);
                root.render(_React.createElement(window.Game));
                console.log("P.I.V.T MAX V21 initialized successfully.");
            } catch (error) {
                console.error('React rendering error:', error);
                hideLoadingOverlay();
                rootElement.innerHTML = '<div style="min-height:100vh;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;padding:2rem;font-family:sans-serif;text-align:center;"><div><h1 style="font-size:2rem;margin-bottom:1rem;color:#ef4444;">Application Error</h1><p style="margin-bottom:1rem;">Something went wrong during initialization.</p><p style="font-size:0.9rem;color:#9ca3af;">Check the browser console (F12) for details.</p><button onclick="location.reload()" style="margin-top:1rem;padding:0.75rem 1.5rem;background:#3b82f6;color:white;border:none;border-radius:0.5rem;cursor:pointer;">Reload Page</button></div></div>';
            }
        }

        // Primary trigger: window 'load' fires after all scripts (incl. async Babel) finish
        window.addEventListener('load', initializeGame);
        // Secondary trigger: DOMContentLoaded in case 'load' already fired (rare but possible)
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() { setTimeout(initializeGame, 10); });
        } else {
            setTimeout(initializeGame, 10);
        }
    </script>
