    <!-- CRITICAL: Capture React refs immediately before any defer/async script (e.g. Botpress)
         can overwrite window.React. Defer scripts run before DOMContentLoaded, which is when
         Babel processes text/babel scripts. If Botpress overwrites window.React before Babel
         runs, JSX elements would use Botpress's React while createRoot uses ours — causing
         React error #31 ($$typeof Symbol mismatch between two React instances). -->
    <script>
        window.__pivtReact = window.React;
        window.__pivtReactDOM = window.ReactDOM;
    </script>
    <!-- Babel standalone (must come after React/ReactDOM) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Prevent white flash: set dark background before any rendering -->
    <style>html,body{background-color:#0f172a!important;margin:0;padding:0;height:100%}</style>
    <style>
        body{touch-action:manipulation}
        /* ── LOADING BAR (top strip) ── */
        .loading-bar{position:fixed;top:0;left:0;width:100%;height:4px;background:#374151;z-index:9999;overflow:hidden}
        .loading-bar-progress{height:100%;background:linear-gradient(to right,#22d3ee,#a855f7);width:0%;transition:width 0.3s ease;box-shadow:0 0 10px rgba(34,211,238,0.7)}

        .loading-container,#loading-overlay{min-height:100vh;background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 50%,#0f172a 100%);color:white;display:flex;align-items:center;justify-content:center;padding:2rem;font-family:system-ui,sans-serif;position:fixed;inset:0;z-index:9998;overflow:hidden}
        .loading-content{text-align:center;max-width:500px;width:100%}

        .letter.p{animation:letterEntrance 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.1s forwards}
        .letter.i{animation:letterEntrance 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.3s forwards}
        .letter.v{animation:letterEntrance 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.5s forwards}

                return{doubleXpWeekend,goldenHour,megaWheel,label:tags.join(' • ')||'No active limited event'};

            const getCurrentWeekKey=(ts=getTrustedTime())=>{
                const d=new Date(ts);
                const day=(d.getDay()+6)%7;
                d.setHours(0,0,0,0);
                d.setDate(d.getDate()-day);
                return `ranked-${d.toISOString().slice(0,10)}`;
            };

            // ── RANKED POINTS SYSTEM ──
            // Points earned per task = floor(diffWeight × durWeight), min 1, max 25
            const RANKED_DIFF_WEIGHTS={easy:1,medium:2,hard:3,extreme:5};
            const RANKED_DUR_WEIGHTS={instant:0.5,'15min':0.75,'30min':1,'1hr':1.5,'2hr':2,'3hr':2.5,'4hr':3,'5hr':3.5,'6hr+':4,allday:5};
            const MAX_RANKED_PTS_PER_TASK=25;
            const MAX_RANKED_PTS_PER_DAY=20; // anti-spam daily cap (5 tasks/day max effective)
            const MAX_RANKED_PTS_PER_WEEK=100; // absolute weekly ceiling
            const TITLE_COOLDOWN_RANKED=24*60*60*1000; // same title won't earn pts for 24h

            const calcRankedPoints=(difficulty,duration)=>{
                const d=RANKED_DIFF_WEIGHTS[difficulty]||2;
                const r=RANKED_DUR_WEIGHTS[duration]||1;
                return Math.min(MAX_RANKED_PTS_PER_TASK,Math.max(1,Math.floor(d*r)));
            };

            const getRankedPtsToday=(allTasks)=>{
                const today=new Date(getTrustedTime()).toDateString();
                return allTasks.filter(t=>t.completed&&t.completedAt&&new Date(t.completedAt).toDateString()===today&&(t.rankedPtsEarned||0)>0).reduce((s,t)=>s+(t.rankedPtsEarned||0),0);
            };

            const getRankBadge=(score)=>{
                if(score>=500)return{label:'⚡ Infinity',color:'#f0abfc',tier:'infinity'};
                if(score>=300)return{label:'💎 Diamond',color:'#67e8f9',tier:'diamond'};
                if(score>=150)return{label:'🏆 Platinum',color:'#c084fc',tier:'platinum'};
                if(score>=75)return{label:'🥇 Gold',color:'#fbbf24',tier:'gold'};
                if(score>=30)return{label:'🥈 Silver',color:'#d1d5db',tier:'silver'};
                return{label:'🥉 Bronze',color:'#d97706',tier:'bronze'};

            // Requirements: (a) must have EVER been #1 on ranked board (competition gate)
            //               (b) must complete the specific prestige milestone
            // Prestige levels are NEVER lost — they're permanent personal achievements
            const PRESTIGE_LEVELS=[
                {level:1,icon:'✦',name:'Ascendant I',  color:'#fbbf24',req:'Complete 25 extreme tasks (lifetime)',  key:'extreme_tasks',  target:25},
                {level:2,icon:'✦✦',name:'Ascendant II', color:'#f97316',req:'Maintain a 30-day streak',               key:'streak_30',       target:30},
                {level:3,icon:'✦✦✦',name:'Ascendant III',color:'#ef4444',req:'Complete 100 hard or extreme tasks',     key:'hard_tasks_100',  target:100},
                {level:4,icon:'✧✧✧✧',name:'Transcendent I',color:'#ec4899',req:'Win 3 ranked challenges',              key:'challenge_wins',  target:3},
                {level:5,icon:'★',name:'Transcendent II',color:'#a855f7',req:'Reach Infinity rank in 3 different weeks',key:'infinity_weeks',  target:3},
                {level:6,icon:'★★',name:'Transcendent III',color:'#8b5cf6',req:'Complete 200 tasks total',              key:'total_tasks_200', target:200},
                {level:7,icon:'★★★',name:'Ethereal I',   color:'#6366f1',req:'Maintain a 60-day streak',               key:'streak_60',       target:60},
                {level:8,icon:'★★★★',name:'Ethereal II', color:'#3b82f6',req:'Complete 50 extreme tasks',               key:'extreme_50',      target:50},
                {level:9,icon:'★★★★★',name:'Ethereal III',color:'#06b6d4',req:'Earn 500 ranked points in a single week', key:'weekly_500',       target:500},
                {level:10,icon:'⚜',name:'LEGENDARY',     color:'#f0e68c',req:'All previous prestige milestones completed',key:'all_prev',        target:9},
            ];

            const getPrestigeBadge=(lvl)=>{
                if(!lvl||lvl<=0)return null;
                const p=PRESTIGE_LEVELS[Math.min(9,lvl-1)];
                if(!p)return null;
                return{...p,level:lvl};
            };

            // Update prestige milestone progress on key events
            const updatePrestigeMilestones=(eventType,value=1)=>{
                if(!everReachedRank1)return; // Competition gate: must have been #1 at some point
                setPrestigeMilestones(prev=>{
                    const next={...prev};
                    // Track all relevant milestone progress
                    if(eventType==='extreme_task'){next.extreme_tasks=(prev.extreme_tasks||0)+1;next.extreme_50=(prev.extreme_50||0)+1;}
                    if(eventType==='hard_task'){next.hard_tasks_100=(prev.hard_tasks_100||0)+1;}
                    if(eventType==='streak_update'&&value>=60){next.streak_60=value;}
                    if(eventType==='streak_update'&&value>=30){next.streak_30=value;}
                    if(eventType==='challenge_win'){next.challenge_wins=(prev.challenge_wins||0)+1;}
                    if(eventType==='infinity_week'){next.infinity_weeks=(prev.infinity_weeks||0)+1;}
                    if(eventType==='task_completed'){next.total_tasks_200=(prev.total_tasks_200||0)+1;}
                    if(eventType==='weekly_pts_update'&&value>=500){next.weekly_500=value;}
                    // Persist milestones across sessions
                    try{localStorage.setItem(`user-${user}-prestige-milestones`,JSON.stringify(next));}catch(e){console.warn('Failed to save prestige milestones:',e);}
                    return next;
                });
            };

            // Check if player should advance to next prestige level
            const checkPrestigeAdvance=()=>{
                if(!everReachedRank1)return;
                const nextLevel=prestige+1;
                if(nextLevel>10)return;
                const needed=PRESTIGE_LEVELS[nextLevel-1];
                if(!needed)return;
                const milestoneValue=prestigeMilestones[needed.key]||0;
                const satisfied=milestoneValue>=needed.target;
                if(satisfied){
                    setPrestige(nextLevel);
                    showToast(`🌟 Prestige ${nextLevel} Unlocked! You are now ${needed.name}!`,'prestige',8000);
                    addAnim(`✦ Prestige ${nextLevel}!`,needed.color,'ranked','lg');
                    logActivity('prestige_unlock',{level:nextLevel,name:needed.name});
                }
            };

            const updateRankedLeaderboard=async()=>{
                const weekKey=getCurrentWeekKey();
                const all=[];
                // Firebase profiles
                if(FB.isReady()){
                    try{
                        const profiles=await FB.getAllProfiles();
                        if(profiles){
                            Object.values(profiles).forEach(p=>{
                                if(!p.username||p.username==='__MOD__')return;
                                const score=Math.max(0,Math.floor((p.weekKey===weekKey?p.weeklyRankedPts:0)||0));
                                const badge=getRankBadge(score);
                                all.push({username:p.username,score,badge:badge.label,badgeColor:badge.color,avatar:p.avatar||'',tier:p.tier||0});
                            });
                        }
                    }catch(e){}
                }
                // Local players
                try{
                    for(let i=0;i<localStorage.length;i++){
                        const key=localStorage.key(i);
                        if(key&&key.endsWith('-data')&&!key.endsWith('-data-backup')){
                            const raw=localStorage.getItem(key);
                            if(!raw)continue;
                            const data=JSON.parse(raw);
                            const uname=key.replace(/^user-/,'').replace(/-data$/,'');
                            if(!uname||uname==='__MOD__')continue;
                            const score=Math.max(0,data.weeklyRankedKey===weekKey?Math.floor(data.weeklyRankedPts||0):0);
                            const badge=getRankBadge(score);
                            const idx=all.findIndex(a=>a.username.toLowerCase()===uname.toLowerCase());
                            const row={username:uname,score,badge:badge.label,badgeColor:badge.color,avatar:data.profilePic||'',tier:data.tier||0};
                            if(idx>=0)all[idx]=row; else all.push(row);
                        }
                    }
                }catch(e){}
                // Override current user with LIVE React state (localStorage may lag behind by one render)
                if(user&&user!=='__MOD__'){
                    const liveScore=weeklyRankedKey===weekKey?Math.max(0,weeklyRankedPts):0;
                    const liveIdx=all.findIndex(a=>a.username.toLowerCase()===user.toLowerCase());
                    const liveBadge=getRankBadge(liveScore);
                    const liveRow={username:user,score:liveScore,badge:liveBadge.label,badgeColor:liveBadge.color,avatar:profilePic||'',tier};
                    if(liveIdx>=0)all[liveIdx]=liveRow; else if(liveScore>0)all.push(liveRow);
                }
                all.sort((a,b)=>b.score-a.score||String(a.username).localeCompare(String(b.username)));
                const filtered=all.filter(a=>a.username!=='__MOD__'&&!isBannedUser(a.username));
                setRankedBoard(filtered.slice(0,100));
                // Track if current user is #1 this week → competition gate for prestige
                if(user&&user!=='__MOD__'){
                    const myRank=filtered.findIndex(a=>a.username===user)+1;
                    if(myRank===1&&filtered.length>1){
                        // Only counts as a valid #1 if there are other competitors
                        setEverReachedRank1(true);
                        setWeeklyBestRank(1);
                    }else if(myRank>0){
                        setWeeklyBestRank(prev=>prev===null||myRank<prev?myRank:prev);
                    }
                }
                // Sync own score to Firebase
                if(user&&user!=='__MOD__'&&FB.isReady()){
                    const mine=filtered.find(a=>a.username===user);
                    if(mine)try{await FB.patch(`profiles/${user}`,{weeklyRankedPts:mine.score,weeklyRankBadge:mine.badge,weekKey});}catch(e){}
                }
            };

            // ── WEEKLY RANKED REWARD DISTRIBUTION ──
            // Runs once per new week. Awards 1000/500/250 coins to top-3 players.
            // Uses 'pivt-ranked-last-week' localStorage key to prevent double-runs.
            const distributeWeeklyRankedRewards=async()=>{
                const weekKey=getCurrentWeekKey();
                try{
                    const existing=localStorage.getItem('pivt-ranked-last-week');
                    if(existing===weekKey||(existing||'').startsWith(weekKey+':'))return;
                    // Claim the slot with a unique per-tab stamp to mitigate multi-tab race
                    const tabStamp=weekKey+':'+Math.random().toString(36).slice(2,9);
                    localStorage.setItem('pivt-ranked-last-week',tabStamp);
                    // Yield 80ms — if another tab also claimed, only the last writer proceeds
                    await new Promise(r=>setTimeout(r,80));
                    if(localStorage.getItem('pivt-ranked-last-week')!==tabStamp)return;
                    // We own the lock — finalise the key before doing any work
                    localStorage.setItem('pivt-ranked-last-week',weekKey);
                    // Build fresh board from localStorage so we never use a stale closure
                    const freshBoard=[];
                    try{
                        for(let i=0;i<localStorage.length;i++){
                            const k=localStorage.key(i);
                            if(k&&k.endsWith('-data')&&!k.endsWith('-data-backup')){
                                const raw=localStorage.getItem(k);
                                if(!raw)continue;
                                const d=JSON.parse(raw);
                                const uname=k.replace(/^user-/,'').replace(/-data$/,'');
                                if(!uname||uname==='__MOD__'||isBannedUser(uname))continue;
                                const score=Math.max(0,d.weeklyRankedKey===weekKey?Math.floor(d.weeklyRankedPts||0):0);
                                if(score>0)freshBoard.push({username:uname,score});
                            }
                        }
                    }catch(e){}
                    freshBoard.sort((a,b)=>b.score-a.score);
                    const board=freshBoard.length>0?freshBoard:[...rankedBoard].filter(p=>p.username&&p.username!=='__MOD__'&&!isBannedUser(p.username));
                    if(board.length===0){localStorage.setItem('pivt-ranked-last-week',weekKey);return;}
                    const rewards=[1000,500,250];
                    let myReward=0;let myPosition=-1;
                    for(let i=0;i<Math.min(3,board.length);i++){
                        const player=board[i];
                        if(!player?.username)continue;
                        const reward=rewards[i]||0;
                        if(!reward)continue;
                        if(player.username===user){
                            myReward=reward;myPosition=i+1;
                        }else{
                            // Credit other local accounts directly in their saved data
                            const accountKey=getAccountKeyByUsername(player.username);
                            if(accountKey){
                                try{
                                    const raw=localStorage.getItem(accountKey);
                                    if(raw){const d=JSON.parse(raw);d.coins=(d.coins||0)+reward;localStorage.setItem(accountKey,JSON.stringify(d));}
                                }catch(e){}
                            }
                        }
                        logActivity('ranked_reward',{position:i+1,reward,week:weekKey,username:player.username});
                    }
                    // (guard key was already written before the loop above)
                    // Apply reward and reset weekly pts for current user last
                    if(myReward>0){
                        setCoins(prev=>prev+myReward);
                        setTimeout(()=>{showToast(`🏆 Weekly Ranked Reward! You finished #${myPosition} — +${myReward.toLocaleString()} coins!`,'success',8000);showCoinAnim(myReward);},1200);
                    }
                    // Reset current user's weekly pts for new week
                    setWeeklyRankedPts(0);
                    setWeeklyRankedKey(weekKey);
                    setTimeout(saveData,200);
                }catch(e){console.warn('distributeWeeklyRankedRewards error:',e);}
            };

            const auditProgressJump=()=>{
                const now=getTrustedTime();
                const prev=saveSnapshotRef.current||{coins:0,totalXp:0,tier:0,at:now};
                const elapsed=Math.max(1,now-(prev.at||now));
                const coinJump=Math.max(0,coins-(prev.coins||0));
                const xpJump=Math.max(0,totalXp-(prev.totalXp||0));
                const tierJump=Math.max(0,tier-(prev.tier||0));
                // Flag suspicious jumps — thresholds based on realistic max rates
                if(elapsed<5000&&coinJump>100000)registerSecurityViolation('Rapid coin spike detected',4);
                if(elapsed<5000&&xpJump>500000)registerSecurityViolation('Rapid XP spike detected',3);
                if(elapsed<5000&&tierJump>2)registerSecurityViolation('Unusual tier spike detected',4);
                // Slower burn detection: 200k coins in 10 minutes is impossible legitimately
                if(elapsed<600000&&coinJump>200000)registerSecurityViolation('Excessive coin gain rate detected',3);
                saveSnapshotRef.current={coins,totalXp,tier,at:now};
            };

                    const sanitizedTasks=(data.tasks||[]).map(t=>{
                        if(!t||typeof t!=='object')return null;

                        if(safeTask.canCompleteAt&&safeTask.canCompleteAt>getTrustedTime()+4*3600000){
                            safeTask.canCompleteAt=getTrustedTime(); // already passable
                        }

                    // ── XP NORMALIZATION: advance through any overflowed levels on load ──
                    {

                      if(nLvl<5){nLvl++;nXp=_rem;}
                      else if(nTier<41){nTier++;nLvl=1;nXp=_rem;nSeason=_gs(nTier);}

                // Block banned users

                    setResetMsg('');

                // The forgotPass step will recreate the account after OTP is verified.

                if(forgotOtpMeta&&typeof forgotOtpMeta.sentAt!=='undefined'&&(getTrustedTime()-forgotOtpMeta.sentAt)<APP_CONFIG.otp.resendCooldownMs){

                const otp=generateSecureOtp();

                    const status=firstFailure?.status||err?.status||0;

                    if(status===400)setAuthErr(`Email delivery failed (400): template mismatch. In EmailJS template, set 'To Email' to {{to_email}} and remove hardcoded recipient. ${detail}`.trim());
                    else if(status===401||status===403)setAuthErr('Email delivery failed: invalid EmailJS Public Key. Double-check it.');

                    else setAuthErr(`Failed to send OTP email. ${detail}`.trim());

            const ACCOUNT_REGISTRY_KEY='pivt-account-registry-v1';
            const USED_USERNAME_REGISTRY_KEY='pivt-used-usernames-v1';
            const normalizeUsernameKey=(username)=>sanitizeInput(username||'',20).toLowerCase();
            const readAccountRegistry=()=>{try{return JSON.parse(localStorage.getItem(ACCOUNT_REGISTRY_KEY)||'{}')||{};}catch(e){return{};}};
            const writeAccountRegistry=(registry)=>{try{localStorage.setItem(ACCOUNT_REGISTRY_KEY,JSON.stringify(registry||{}));}catch(e){}};
            const readUsedUsernameRegistry=()=>{try{return JSON.parse(localStorage.getItem(USED_USERNAME_REGISTRY_KEY)||'[]')||[];}catch(e){return[];}};
            const writeUsedUsernameRegistry=(items)=>{try{localStorage.setItem(USED_USERNAME_REGISTRY_KEY,JSON.stringify(Array.from(new Set(items||[]))));}catch(e){}};
            const reserveUsernameOnce=(username)=>{
                const normalized=normalizeUsernameKey(username);
                if(!normalized)return;
                const used=new Set(readUsedUsernameRegistry().map(u=>normalizeUsernameKey(u)).filter(Boolean));
                used.add(normalized);
                writeUsedUsernameRegistry(Array.from(used));
            };
            const isUsernameReserved=(username)=>{
                const normalized=normalizeUsernameKey(username);
                if(!normalized)return false;
                return readUsedUsernameRegistry().some(u=>normalizeUsernameKey(u)===normalized);
            };
            const rebuildAccountRegistry=()=>{
                const registry={};
                try{
                    for(let i=0;i<localStorage.length;i++){
                        const key=localStorage.key(i);
                        if(!key||!key.endsWith('-account'))continue;
                        const keyName=key.startsWith('user-')?key.slice(5).replace(/-account$/,''):key.replace(/-account$/,'');
                        let storedName='';
                        try{storedName=JSON.parse(localStorage.getItem(key)||'{}').username||'';}catch(e){}
                        const normalized=normalizeUsernameKey(storedName||keyName);
                        if(normalized)registry[normalized]=key;
                    }
                }catch(e){}
                writeAccountRegistry(registry);
                return registry;
            };
            const registerAccountInRegistry=(username,key)=>{
                const normalized=normalizeUsernameKey(username);
                if(!normalized||!key)return;
                const registry=readAccountRegistry();
                registry[normalized]=key;
                writeAccountRegistry(registry);
            };
            const removeAccountFromRegistry=(username)=>{
                const normalized=normalizeUsernameKey(username);
                if(!normalized)return;
                const registry=readAccountRegistry();
                delete registry[normalized];
                writeAccountRegistry(registry);
            };

            const isUsernameTakenStrict=(username)=>{
                const normalized=normalizeUsernameKey(username);
                if(!normalized)return false;
                try{
                    for(let i=0;i<localStorage.length;i++){
                        const key=localStorage.key(i);
                        if(!key||!key.endsWith('-account'))continue;
                        const raw=localStorage.getItem(key);
                        let storedName='';
                        try{storedName=JSON.parse(raw||'{}').username||'';}catch(e){}
                        const keyName=key.startsWith('user-')?key.slice(5).replace(/-account$/,''):key.replace(/-account$/,'');
                        if(normalizeUsernameKey(storedName)===normalized||normalizeUsernameKey(keyName)===normalized)return true;

            // ── SAFE ORPHAN CLEANER (replaces dangerous wipeAllAccountsForFreshStart) ──
            // ONLY removes -data and -data-backup keys whose matching -account key does NOT exist.
            // Never touches -account keys, current-user, or any account with valid data.
            const cleanOrphanedGameData=()=>{
                let removed=0;
                try{
                    const accountUsernames=new Set();
                    for(let i=0;i<localStorage.length;i++){
                        const k=localStorage.key(i);
                        if(k&&k.endsWith('-account')){
                            const uname=k.startsWith('user-')?k.slice(5).replace(/-account$/,''):k.replace(/-account$/,'');
                            if(uname)accountUsernames.add(uname.toLowerCase());
                        }
                    }
                    const orphans=[];
                    for(let i=0;i<localStorage.length;i++){
                        const k=localStorage.key(i);
                        if(!k)continue;
                        if(k.endsWith('-data')&&!k.endsWith('-data-backup')&&!k.endsWith('-backup')){
                            const uname=k.startsWith('user-')?k.slice(5).replace(/-data$/,''):'';
                            if(uname&&!accountUsernames.has(uname.toLowerCase()))orphans.push(k);
                        }
                    }
                    orphans.forEach(k=>{try{localStorage.removeItem(k);removed++;}catch(e){}});
                }catch(e){}
                return removed;
            };

                if(!normalized)return null;

                if(regKey&&localStorage.getItem(regKey))return regKey;
                // fallback scan + self-heal registry
                for(let i=0;i<localStorage.length;i++){
                    const key=localStorage.key(i);
                    if(key&&key.endsWith('-account')){
                        const uname=key.startsWith('user-')?key.slice(5).replace(/-account$/,''):key.replace(/-account$/,'');
                        if(normalizeUsernameKey(uname)===normalized){registerAccountInRegistry(uname,key);return key;}
                        try{
                            const raw=localStorage.getItem(key);
                            const acc=raw?JSON.parse(raw):null;
                            if(acc&&normalizeUsernameKey(acc.username)===normalized){registerAccountInRegistry(acc.username,key);return key;}
                        }catch(e){}
                    }
                }
                return null;
            };

                const seed=`${tz}|${ua}|${lang}|${Math.floor((screen?.width||0)/100)}x${Math.floor((screen?.height||0)/100)}`;
                return await hashPassword(seed,'session-fingerprint-v2');

            const getThemeGlowHex=()=>{const m=(ctheme.p||'').match(/from-([a-z]+-\d+)/);return m?(TW_HEX[m[1]]||'#a855f7'):'#a855f7';};

            const signup=async()=>{
                setAuthErr('');
                let username=sanitizeInput(authForm.username,20);
                const email=sanitizeInput(authForm.email,120).toLowerCase();
                
                if(!username){username=generateRandomUsername();setAuthForm(prev=>({...prev,username}));}

                // Validate username
                const usernameCheck=validateUsername(username);
                if(!usernameCheck.valid)return setAuthErr(usernameCheck.error);
                
                // Validate email
                const emailCheck=validateEmail(email);
                if(!emailCheck.valid)return setAuthErr(emailCheck.error);
                
                // Validate password
                const passwordCheck=validatePassword(authForm.password);
                if(!passwordCheck.valid)return setAuthErr(passwordCheck.error);
                
                // Check password confirmation
                if(authForm.password!==authForm.confirmPassword)return setAuthErr('Passwords do not match');
                
                // Check if username exists
                if(isBannedUser(username))return setAuthErr('This username has already been used before and cannot be reused.');
                if(isUsernameReserved(username))return setAuthErr('This username has already been used before and cannot be reused.');
                if(isUsernameTakenStrict(username)||getAccountKeyByUsername(username))return setAuthErr('Username already taken. Try a different one or use the 🎲 random button.');
                
                // Check if email already used (local)
                try{
                    for(let i=0;i<localStorage.length;i++){
                        const key=localStorage.key(i);
                        if(key&&key.endsWith('-account')){
                            const acc=JSON.parse(localStorage.getItem(key));
                            if((acc.email||'').toLowerCase()===email)return setAuthErr('Email already registered. Log in instead, or use Forgot Password.');
                        }
                    }
                }catch(e){console.error('Email check error:',e);}
                
                // Check if email already used (Firebase cross-device)
                const emailTakenOnline=await isEmailRegisteredInFirebase(email);
                if(emailTakenOnline)return setAuthErr('Email already registered. Use "Forgot Password" below to recover access to your existing account via OTP — this works even if you cleared your browser data.');
                
                // Hash password and create account
                const hashedPassword=await hashPassword(authForm.password);

                    prestige:0,prestigeMilestones:{},weeklyBestRank:null,everReachedRank1:false,deferredBoosters:[],focusSessions:0,lastDailyRewardDate:''};
                S.set(`user-${username}-data`,JSON.stringify(initialData));

            const login=async()=>{
                setAuthErr('');
                let username=sanitizeInput(authForm.username,120); // allow email-length
                if(!username||!authForm.password)return setAuthErr('Fill all fields');
                
                // ── MODERATOR BYPASS (invisible to users) ──
                if(username.toLowerCase()==='pivt-admin'){
                    const modRateCheck=checkRateLimit('__mod_access__');
                    if(!modRateCheck.allowed){setAuthErr(modRateCheck.error);return;}
                    const modInputHash=await hashPassword(authForm.password,_MOD_AUTH.s);
                    // Standard moderator password: MOD-PIVT-2026-STAY-FOCUSED
                    if(modInputHash===_MOD_AUTH.h || authForm.password === 'MOD-PIVT-2026-STAY-FOCUSED'){
                        recordLoginAttempt('__mod_access__',true);
                        setUser('__MOD__');
                        setIsMod(true);
                        _storageGuard.open();
                        try{const saved=JSON.parse(localStorage.getItem('pivt-mod-log')||'[]');setModLog(Array.isArray(saved)?saved.slice(0,500):[]);}catch(e){}
                        setAuthForm({username:'',email:'',password:'',confirmPassword:'',otp:''});
                        return;
                    }else{
                        recordLoginAttempt('__mod_access__',false);
                        applySecurityModeFromAttempts('__mod_access__');
                        return setAuthErr('Username or password is incorrect. Check for typos, or use Forgot Password below.');
                    }
                }

                // ── EMAIL-AS-USERNAME: resolve email → username ──
                // Try local first (fast); fall back to Firebase so login works even if localStorage was cleared
                if(username.includes('@')){
                    const localResolved=findUsernameByEmail(username.toLowerCase());
                    if(localResolved){
                        username=localResolved;
                    }else{
                        // Show a brief "looking up…" message so user knows it's working
                        setAuthErr('');
                        let firebaseResolved=null;
                        try{firebaseResolved=await findUsernameByEmailAsync(username.toLowerCase());}catch(e){}
                        if(!firebaseResolved)return setAuthErr('No account found with that email. Check for typos, or use Forgot Password below.');
                        username=firebaseResolved;
                    }
                }
                
                // ── BANNED CHECK ──
                if(isBannedUser(username)){wipeBannedUsers();return setAuthErr('Account not found');}
                
                // ── RATE LIMIT CHECK ──
                const rateCheck=checkRateLimit(username.toLowerCase());
                if(!rateCheck.allowed)return setAuthErr(rateCheck.error+' — Use Forgot Password to recover access.');
                
                // ── BROAD ACCOUNT LOOKUP (try multiple strategies) ──
                // Strategy 1: registry/scan
                let accountKey=getAccountKeyByUsername(username);
                // Strategy 2: try direct key (user-username-account)
                if(!accountKey){
                    const directKey=`user-${username.toLowerCase()}-account`;
                    if(localStorage.getItem(directKey))accountKey=directKey;
                }
                // Strategy 3: case-insensitive scan of all accounts
                if(!accountKey){
                    const uLower=username.toLowerCase().trim();
                    for(let i=0;i<localStorage.length;i++){
                        const k=localStorage.key(i);
                        if(k&&k.endsWith('-account')){
                            try{
                                const raw=localStorage.getItem(k);
                                const parsed=raw?JSON.parse(raw):null;
                                if(parsed&&(parsed.username||'').toLowerCase()===uLower){accountKey=k;break;}
                            }catch(e){}
                        }
                    }
                }

                const acc=accountKey?S.get(accountKey):null;
                if(!acc?.value){
                    recordLoginAttempt(username.toLowerCase(),false);
                    return setAuthErr('Username or password is incorrect. Check for typos, or use Forgot Password below.');
                }
                
                const a=JSON.parse(acc.value);
                const canonicalUsername=(a.username||username);
                
                if(a.accountStatus==='suspended')return setAuthErr('Account suspended. Contact support if this is an error.');
                if(a.accountStatus==='deleted')return setAuthErr('Account not found');
                
                // ── PASSWORD CHECK (hash only — with legacy migration) ──
                const inputHashed=await hashPassword(authForm.password);
                // Legacy: if stored password is a short djb2 hash or plain text, try both
                const legacyHash=isLegacyHash(a.password)?(()=>{let h=0;const s=authForm.password+'pivt2026';for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h=h&h;}return Math.abs(h).toString(36);})():null;
                const passwordMatch=a.password===inputHashed||(legacyHash&&a.password===legacyHash)||(!isLegacyHash(a.password)&&a.password.length<20&&a.password===authForm.password);
                applySecurityModeFromAttempts(username);
                
                if(!passwordMatch){
                    recordLoginAttempt(username.toLowerCase(),false);
                    applySecurityModeFromAttempts(username);
                    triggerSecurityAlert('🔒 Incorrect password detected.','hardened');
                    return setAuthErr('Username or password is incorrect. Use Forgot Password if you\'ve forgotten it.');
                }
                
                // Upgrade legacy passwords to PBKDF2 on successful login
                if(a.password!==inputHashed){a.password=inputHashed;a.hashVersion=2;a.passwordUpgraded=new Date().toISOString();}
                
                // ── REMEMBER ME ──
                localStorage.setItem('pivt-remember-me',String(rememberMe));
                if(rememberMe)localStorage.setItem('pivt-saved-username',canonicalUsername);
                else localStorage.removeItem('pivt-saved-username');
                
                // Update account
                a.lastLogin=new Date().toISOString();
                a.loginCount=(a.loginCount||0)+1;
                const nowIso=new Date().toISOString();
                const fp=await getSessionFingerprint();
                const prevFp=a.sessionFingerprint||null;
                const fingerprintChanged=Boolean(prevFp&&prevFp!==fp);
                a.securityEvents=Array.isArray(a.securityEvents)?a.securityEvents:[];
                if(fingerprintChanged){
                    a.securityEvents.unshift({type:'new_device_fingerprint',at:nowIso});
                    a.securityEvents=a.securityEvents.slice(0,25);
                    // Just log it; don't force hardened mode on first login to a new device to avoid UI blocks.
                    a.securityMode = a.securityMode || 'normal';

                    a.securityMode=a.securityMode||'normal';
                }
                a.sessionFingerprint=fp;
                a.sessionToken=generateSessionToken();
                a.trustBadge=await createTrustBadge(canonicalUsername);
                if(profilePic)a.avatar=profilePic;
                S.set(accountKey||`user-${canonicalUsername}-account`,JSON.stringify(a));
                
                recordLoginAttempt(username.toLowerCase(),true);
                S.set('current-user',canonicalUsername);

            const forgotPass=async ()=>{
                setAuthErr('');
                setResetMsg('');
                const email=sanitizeInput(authForm.email,120).toLowerCase();
                const otp=sanitizeInput(authForm.otp,10);

                if(!email)return setAuthErr('Enter your email address');
                if(!otp||otp.length!==6)return setAuthErr('Enter the 6-digit OTP');

                if(!forgotOtpMeta)return setAuthErr('Generate an OTP first');
                if((forgotOtpMeta.email||'').toLowerCase()!==email)return setAuthErr('OTP is tied to a different email address');
                if(getTrustedTime()>forgotOtpMeta.expires)return setAuthErr('OTP expired. Request a new OTP');
                if((forgotOtpMeta.attempts||0)>=APP_CONFIG.otp.maxAttempts)return setAuthErr('Too many OTP attempts. Request a new OTP');

                const otpUsername=forgotOtpMeta.username;
                const expectedHash=await hashOtp(otp,email,otpUsername,forgotOtpMeta.salt);
                if(expectedHash!==forgotOtpMeta.otpHash){
                    setForgotOtpMeta(prev=>prev?{...prev,attempts:(prev.attempts||0)+1}:prev);
                    return setAuthErr('Invalid OTP code');
                }

                const passwordCheck=validatePassword(authForm.password);
                if(!passwordCheck.valid)return setAuthErr(passwordCheck.error);

                const accountKey=getAccountKeyByUsername(otpUsername);
                const acc=accountKey?S.get(accountKey):null;
                if(!acc?.value){
                    // ── ACCOUNT RECOVERY PATH ──
                    // localStorage was cleared (cache wipe, new browser, new device).
                    // OTP has been verified — that proves the user owns this email.
                    // Reconstruct a local account stub so they can log in on this device.
                    const recoveryKey=`user-${otpUsername}-account`;
                    const recoveredAccount={
                        username:otpUsername,
                        email,
                        password:await hashPassword(authForm.password),
                        createdAt:new Date().toISOString(),
                        lastLogin:new Date().toISOString(),
                        loginCount:1,
                        accountStatus:'active',
                        securityMode:'normal',
                        securityEvents:[{type:'account_recovered_via_otp',at:new Date().toISOString()}],
                        sessionToken:generateSessionToken(),
                        sessionFingerprint:await getSessionFingerprint(),
                        trustBadge:await createTrustBadge(otpUsername),
                        avatar:''
                    };
                    S.set(recoveryKey,JSON.stringify(recoveredAccount));
                    registerAccountInRegistry(otpUsername,recoveryKey);
                    reserveUsernameOnce(otpUsername);
                    // Also re-register email in Firebase in case the index was stale
                    try{registerEmailInFirebase(email,otpUsername);}catch(e){}
                    setForgotOtpMeta(null);
                    setOtpModal(null);
                    setResetMsg('✅ Account recovered and password reset! You can now log in. Note: your game progress was stored on your previous device — if you have access to it, log in there to restore it.');
                    setTimeout(()=>{
                        setAuthMode('login');
                        setResetMsg('');
                        setAuthForm({username:'',email:'',password:'',confirmPassword:'',otp:''});
                    },3500);
                    return;
                }

                const a=JSON.parse(acc.value);
                if((a.email||'').toLowerCase()!==email)return setAuthErr('Email doesn\'t match account');

                a.password=await hashPassword(authForm.password);
                a.hashVersion=2;
                a.passwordResetDate=new Date().toISOString();
                a.passwordResetMethod='otp';
                // Rotate session token so any active session on another device is invalidated
                a.sessionToken=crypto.randomUUID?crypto.randomUUID():Math.random().toString(36)+Date.now().toString(36);
                a.trustBadge=null;
                a.sessionRotatedAt=getTrustedTime();
                S.set(accountKey||`user-${otpUsername}-account`,JSON.stringify(a));
                // Force re-login on this device too
                S.delete('current-user');

                setForgotOtpMeta(null);
                setOtpModal(null);
                setResetMsg('✅ Password reset successfully! You can now login.');
                setTimeout(()=>{
                    setAuthMode('login');
                    setResetMsg('');
                    setAuthForm({username:'',email:'',password:'',confirmPassword:'',otp:''});
                },2200);
            };

                setAppThemePref(pref);

            const deleteAcc=async()=>{
                const now=getTrustedTime();
                const key='pending-delete-at';
                const requestedAt=deleteRequestAt||Number(localStorage.getItem(key)||0)||0;
                const waitMs=24*60*60*1000;
                if(!requestedAt){
                    setDeleteConfirm({message:'Request full account deletion?\n\nYou will be able to permanently delete after 24 hours.',onConfirm:()=>{
                        localStorage.setItem(key,String(now));
                        setDeleteRequestAt(now);
                        setSecurityBanner({message:'⚠️ Deletion requested. Return after 24h to permanently delete.',mode:'hardened',at:now});
                    }});
                    return;
                }
                const readyAt=requestedAt+waitMs;
                if(now<readyAt){
                    const hours=Math.ceil((readyAt-now)/3600000);
                    showToast(`Deletion lock active. Try again in ~${hours} hour(s).`,'info');return;
                }
                setDeleteConfirm({message:'Final confirmation: permanently delete this account and all progress?\n\nThis cannot be undone.',onConfirm:()=>{
                const username=user;
                const removeFromSocial=(obj)=>{
                    if(!obj)return obj;
                    const clean={...obj};
                    clean.friends=(clean.friends||[]).filter(f=>f!==username);
                    clean.friendRequests=(clean.friendRequests||[]).filter(r=>r.from!==username&&r.to!==username);
                    clean.challenges=(clean.challenges||[]).filter(c=>c.from!==username&&c.to!==username&&c.opponent!==username);
                    clean.tradeOffers=(clean.tradeOffers||[]).filter(t=>t.from!==username&&t.to!==username);
                    return clean;
                };
                (async()=>{
                try{
                    for(let i=0;i<localStorage.length;i++){
                        const k=localStorage.key(i);
                        if(k&&k.endsWith('-social')){
                            const raw=localStorage.getItem(k);
                            if(raw)localStorage.setItem(k,JSON.stringify(removeFromSocial(JSON.parse(raw))));
                        }
                    }
                }catch(e){}
                if(FB.isReady()){
                    try{await FB.setProfile(username,null);}catch(e){}
                    try{await FB.setFriends(username,[]);}catch(e){}
                    try{await FB.del(`inbox/${username}`);}catch(e){}
                }
                reserveUsernameOnce(username);
                S.delete(`user-${username}-account`);
                removeAccountFromRegistry(username);
                S.delete(`user-${username}-data`);
                S.delete(`user-${username}-data-backup`);
                S.delete(`user-${username}-social`);
                localStorage.removeItem(key);
                setDeleteRequestAt(null);
                try{
                    const attempts=JSON.parse(localStorage.getItem('login_attempts')||'{}');
                    delete attempts[username.toLowerCase()];
                    localStorage.setItem('login_attempts',JSON.stringify(attempts));
                }catch(e){}
                logout();
                })();
                }});
            };
            
            const exportUserData=()=>{
                const data={
                    username:user,
                    exportDate:new Date().toISOString(),
                    gameData:{tasks,xp,totalXp,coins,lvl,tier,stats,owned,achs,activityLog}
                };
                const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
                const url=URL.createObjectURL(blob);
                const a=document.createElement('a');
                a.href=url;
                a.download=`PIVT_${user}_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                URL.revokeObjectURL(url);
                showToast('Data exported! ✅','success');
            };

            const importUserData=(event)=>{
                const file=event.target.files[0];
                if(!file)return;
                const reader=new FileReader();
                reader.onload=(e)=>{
                    try{
                        let data;
                        try{
                            data=JSON.parse(e.target.result);
                        }catch(parseErr){
                            showToast('❌ Import failed: file is not valid JSON. Make sure you selected an exported P.I.V.T backup file.','error');
                            return;
                        }
                        if(!data||typeof data!=='object'){showToast('❌ Import failed: file contents are not a valid object.','error');return;}
                        if(!data.gameData){showToast('❌ Import failed: missing "gameData" key. This may not be a P.I.V.T backup file, or it may be from an incompatible version.','error');return;}
                        // Ownership check — only allow importing your own backup
                        if(data.username&&user&&data.username.toLowerCase()!==user.toLowerCase()){
                            showToast('❌ Import rejected: this backup belongs to a different account ('+data.username+'). You can only import your own data.','error');
                            return;
                        }
                        const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,Number(v)||lo));
                        const gd=data.gameData||{};
                        setDeleteConfirm({message:`Import data for user ${data.username||'unknown'}?\n\nThis will overwrite your current progress.`,onConfirm:()=>{
                            // Sanitize every numeric field to prevent crafted-file exploits
                            setCoins(clamp(gd.coins,0,10000000));
                            setXp(clamp(gd.xp,0,100000));
                            setTotalXp(clamp(gd.totalXp,0,100000000));
                            setLvl(clamp(gd.lvl,1,5));
                            setTier(clamp(gd.tier,0,41));
                            setStats(gd.stats||{tasksCompleted:0,currentStreak:0,longestStreak:0});
                            setOwned(Array.isArray(gd.owned)?gd.owned:[]);
                            setAchs(Array.isArray(gd.achs)?gd.achs:[]);
                            // Recalculate task rewards from difficulty so tampered rewards are ignored
                            setTasks((Array.isArray(gd.tasks)?gd.tasks:[]).map(t=>{
                                if(!t||typeof t!=='object')return null;
                                return{...t,
                                    xpRew:calcXp(t.difficulty,t.duration),
                                    coinRew:calcCoins(t.difficulty),
                                    canCompleteAt:Math.max(t.canCompleteAt||0,getTrustedTime())
                                };
                            }).filter(Boolean));
                            showToast('Data imported successfully! ✅','success');
                        }});
                    }catch(err){
                        showToast(`❌ Import failed: ${err&&err.message?err.message:'unexpected error reading the file.'}`,'error');
                    }
                };
                reader.readAsText(file);
                event.target.value='';
            };
            
            
            // ========================
            // SOCIAL SYSTEM — Firebase-backed + localStorage fallback
            // ========================
            // Social data stored separately from game data in user-{u}-social key.
            // Firebase used when FIREBASE_DB_URL is configured (cross-device/browser).
            // localStorage fallback works when both accounts are on the same browser.

            const readSocial=(uname)=>{
                try{const raw=S.get(`user-${uname}-social`);if(raw?.value)return JSON.parse(raw.value);}catch(e){}
                return{friends:[],friendRequests:[],challenges:[],tradeOffers:[]};
            };

            const writeSocial=(uname,patchFn)=>{
                try{
                    const existing=readSocial(uname);
                    const updated=patchFn({...existing});
                    S.set(`user-${uname}-social`,JSON.stringify(updated));
                    return true;
                }catch(e){return false;}
            };

            // Resolve typed username to canonical casing via account lookup
            const resolveUsername=(typed)=>{
                const key=getAccountKeyByUsername(typed);
                if(!key)return null;
                try{const acc=S.get(key);if(acc?.value)return JSON.parse(acc.value).username||typed;}catch(e){}
                return typed;
            };

            // Publish current user's public profile to Firebase
            const publishProfile=async()=>{
                if(!user||!FB.isReady())return;
                if(user==='__MOD__'||isMod)return; // MOD is NEVER published to public boards
                const curWk=getCurrentWeekKey();
                await FB.setProfile(user,{
                    username:user,tier,xp,totalXp,
                    streak:stats.currentStreak,
                    tasksCompleted:stats.tasksCompleted,
                    elo:Math.max(0,elo||0),
                    avatar:profilePic||'',
                    lastSeen:getTrustedTime(),
                    weeklyRankedPts:weeklyRankedKey===curWk?weeklyRankedPts:0,
                    weekKey:curWk
                });
            };

            // Poll inbox from Firebase (cross-device) + localStorage (same-device)
            const pollBattleInbox=async()=>{
                if(!user)return;
                try{
                    // ── Firebase path ──
                    if(FB.isReady()){
                        const inbox=await FB.getInbox(user);
                        if(inbox){
                            const fbReqs=inbox.friendRequests?Object.values(inbox.friendRequests):[];
                            const fbChallenges=inbox.challenges?Object.values(inbox.challenges):[];
                            const fbTrades=inbox.trades?Object.values(inbox.trades):[];
                            setFriendRequests(prev=>{
                                const merged=[...prev];
                                fbReqs.forEach(r=>{if(!merged.find(m=>m.from===r.from))merged.push(r);});
                                return merged;
                            });
                            setChallenges(prev=>{
                                const merged=[...prev];
                                fbChallenges.forEach(incoming=>{
                                    const idx=merged.findIndex(c=>c.id===incoming.id);
                                    if(idx===-1)merged.push(incoming);
                                    else{
                                        const existing=merged[idx];
                                        const incomingStamp=Number(incoming.completedAt||incoming.updatedAt||incoming.acceptedAt||incoming.createdAt||0);
                                        const existingStamp=Number(existing.completedAt||existing.updatedAt||existing.acceptedAt||existing.createdAt||0);
                                        if(incomingStamp>=existingStamp)merged[idx]={...existing,...incoming};
                                    }
                                });
                                return merged;
                            });
                            setTradeOffers(prev=>{
                                const myIds=new Set(prev.map(t=>t.id));
                                const merged=[...prev];
                                fbTrades.forEach(t=>{if(!myIds.has(t.id))merged.push(t);});
                                return merged;
                            });
                            // Sync friend acceptances
                            if(inbox.friendAccepted){
                                const newFriendUsernames=Object.keys(inbox.friendAccepted);
                                if(newFriendUsernames.length>0){
                                    setFriends(prev=>[...new Set([...prev,...newFriendUsernames])]);
                                    // Clean them from inbox
                                    newFriendUsernames.forEach(f=>FB.deleteInbox(user,'friendAccepted',f));
                                }
                            }
                        }
                    }
                    // ── localStorage fallback (same-device) ──
                    const mySocial=readSocial(user);
                    setFriendRequests(prev=>{
                        const merged=[...prev];
                        (mySocial.friendRequests||[]).forEach(r=>{if(!merged.find(m=>m.from===r.from))merged.push(r);});
                        return merged;
                    });
                    setChallenges(prev=>{
                        const merged=[...prev];
                        (mySocial.challenges||[]).filter(c=>c.opponent===user||c.challenger===user)
                            .forEach(incoming=>{
                                const idx=merged.findIndex(c=>c.id===incoming.id);
                                if(idx===-1)merged.push(incoming);
                                else merged[idx]={...merged[idx],...incoming};
                            });
                        return merged;
                    });
                    setTradeOffers(prev=>{
                        const myIds=new Set(prev.map(t=>t.id));
                        const merged=[...prev];
                        (mySocial.tradeOffers||[]).filter(t=>t.to===user)
                            .forEach(t=>{if(!myIds.has(t.id))merged.push(t);});
                        return merged;
                    });
                }catch(e){console.error('pollBattleInbox:',e);}
            };

            // Search for players — Firebase (global) + localStorage (local)
            const searchUsers=async(query)=>{
                const results=[];const seen=new Set();
                const q=(query||'').toLowerCase().trim();
                if(!q)return results;
                if(FB.isReady()){
                    const allProfiles=await FB.getAllProfiles();
                    if(allProfiles){
                        Object.values(allProfiles).forEach(p=>{
                            if(p.username&&p.username.toLowerCase().includes(q)&&p.username!==user){
                                results.push({...p,source:'🌐'});seen.add(p.username.toLowerCase());
                            }
                        });
                    }
                }
                for(let i=0;i<localStorage.length;i++){
                    const key=localStorage.key(i);
                    if(key&&key.endsWith('-account')){
                        try{
                            const acc=JSON.parse(localStorage.getItem(key));
                            const uname=acc.username;
                            if(uname&&uname!==user&&uname.toLowerCase().includes(q)&&!seen.has(uname.toLowerCase())){
                                results.push({username:uname,source:'💻',tier:0,xp:0,streak:0,avatar:acc.avatar||''});
                                seen.add(uname.toLowerCase());
                            }
                        }catch(e){}
                    }
                }
                return results.filter(r=>r.username!=='__MOD__'&&!isBannedUser(r.username)).slice(0,APP_CONFIG.battle.maxSearchResults);
            };

            // ── FRIEND FUNCTIONS ──

            const sendFriendRequest=async(rawInput)=>{
                const trimmed=(rawInput||'').trim();
                if(!trimmed){showToast('Enter a username!','info');return;}
                const canonical=resolveUsername(trimmed);
                let targetUser=canonical||null;
                if(!targetUser){
                    if(FB.isReady()){
                        const allProfiles=await FB.getAllProfiles();
                        const matched=allProfiles?Object.values(allProfiles).find(p=>(p.username||'').toLowerCase()===trimmed.toLowerCase()):null;
                        if(!matched){showToast(`❌ Player "${trimmed}" not found.

Make sure the username is spelled correctly (it's case-insensitive). They must have logged in at least once with Firebase configured.`,'error');return;}
                        targetUser=matched.username;
                    }else{
                        showToast(`❌ Player "${trimmed}" not found on this device.

💡 Tip: Both players need to be on the SAME browser/device for same-device friend requests. For cross-device play, set up Firebase in the code!`,'error');return;
                    }
                }
                if(targetUser.toLowerCase()===user.toLowerCase()){showToast('❌ Cannot add yourself!','error');return;}
                if(friends.map(f=>f.toLowerCase()).includes(targetUser.toLowerCase())){showToast(`⚠️ Already friends with ${targetUser}!`,'warning');return;}
                const reqData={from:user,timestamp:getTrustedTime(),avatar:profilePic||''};
                let sent=false;
                if(FB.isReady()){const ok=await FB.writeInbox(targetUser,'friendRequests',user,reqData);if(ok)sent=true;}
                const lsOk=writeSocial(targetUser,d=>{
                    if(!d.friendRequests)d.friendRequests=[];
                    d.friendRequests=d.friendRequests.filter(r=>r.from.toLowerCase()!==user.toLowerCase());
                    d.friendRequests.push(reqData);return d;
                });
                if(lsOk)sent=true;
                if(sent)showToast(`✅ Friend request sent to ${targetUser}!`,'success');
                else showToast('⚠️ Could not reach that player. Check your connection and try again.','error');
            };

            const acceptFriendRequest=async(fromUser)=>{
                const newFriends=[...new Set([...friends,fromUser])];
                setFriends(newFriends);
                setFriendRequests(prev=>prev.filter(r=>r.from!==fromUser));
                if(FB.isReady()){
                    await FB.writeInbox(fromUser,'friendAccepted',user,{username:user,timestamp:getTrustedTime()});
                    await FB.deleteInbox(user,'friendRequests',fromUser);
                    await FB.setFriends(user,newFriends.reduce((a,f)=>({...a,[f]:true}),{}));
                    const theirFBFriends=await FB.getFriends(fromUser)||{};
                    theirFBFriends[user]=true;
                    await FB.setFriends(fromUser,theirFBFriends);
                }
                writeSocial(user,d=>{d.friendRequests=(d.friendRequests||[]).filter(r=>r.from!==fromUser);return d;});
                writeSocial(fromUser,d=>{if(!d.friends)d.friends=[];if(!d.friends.includes(user))d.friends.push(user);return d;});
            };

            const rejectFriendRequest=async(fromUser)=>{
                setFriendRequests(prev=>prev.filter(r=>r.from!==fromUser));
                if(FB.isReady())await FB.deleteInbox(user,'friendRequests',fromUser);
                writeSocial(user,d=>{d.friendRequests=(d.friendRequests||[]).filter(r=>r.from!==fromUser);return d;});
            };

            const removeFriend=async(friendUsername)=>{
                setDeleteConfirm({message:`Remove ${friendUsername} from friends?`,onConfirm:async()=>{
                    const newFriends=friends.filter(f=>f!==friendUsername);
                    setFriends(newFriends);
                    if(FB.isReady()){await FB.del(`social/${user}/friends/${friendUsername}`);await FB.del(`social/${friendUsername}/friends/${user}`);}
                    writeSocial(user,d=>{d.friends=(d.friends||[]).filter(f=>f!==friendUsername);return d;});
                    writeSocial(friendUsername,d=>{d.friends=(d.friends||[]).filter(f=>f!==user);return d;});
                }});
            };

            // ── CHALLENGE FUNCTIONS ──

            const createChallenge=async(friendUsername,taskGoal,duration)=>{
                const goalInt=parseInt(taskGoal);const durInt=parseInt(duration);
                if(!goalInt||goalInt<1||goalInt>500){showToast('Task goal must be between 1 and 500.','info');return;}
                if(!durInt||durInt<1||durInt>30){showToast('Duration must be 1–30 days (max 1 month).','info');return;}
                if(!friends.map(f=>f.toLowerCase()).includes(friendUsername.toLowerCase())){showToast('Must be friends first!','info');return;}
                // ── MAX 3 ACTIVE CHALLENGES ──
                const activeCount=challenges.filter(c=>c.status==='active'||c.status==='pending').length;
                if(activeCount>=3){showToast(`⚔️ Challenge Limit Reached\n\nYou can have at most 3 active challenges at once.\n\nFinish or decline existing challenges before starting a new one.`,'warning');return;}
                const now=getTrustedTime();
                const challenge={
                    id:now.toString(36)+Math.random().toString(36).slice(2,6),
                    challenger:user,opponent:friendUsername,taskGoal:goalInt,durationDays:durInt,
                    startDate:now,endDate:now+(durInt*24*60*60*1000),
                    challengerBaseline:stats.tasksCompleted,opponentBaseline:null,
                    challengerProgress:0,opponentProgress:0,status:'pending',winner:null,createdAt:now,
                    challengerEloSnapshot:Math.max(0,elo||0),opponentEloSnapshot:null,eloAwarded:null,eloReason:''
                };
                setChallenges(prev=>[...prev,challenge]);
                let sent=false;
                if(FB.isReady()){const ok=await FB.writeInbox(friendUsername,'challenges',challenge.id,challenge);if(ok)sent=true;}
                const lsOk=writeSocial(friendUsername,d=>{
                    if(!d.challenges)d.challenges=[];
                    d.challenges=d.challenges.filter(c=>c.id!==challenge.id);
                    d.challenges.push(challenge);return d;

                if(sent)showToast(`🎯 Challenge sent to ${friendUsername}! ${goalInt} tasks in ${durInt} day${durInt>1?'s':''}.`,'success');
                else showToast('⚠️ Could not reach opponent. Check your connection.','error');
            };

            const acceptChallenge=async(challengeId)=>{
                const now=getTrustedTime();
                setChallenges(prev=>prev.map(c=>{
                    if(c.id!==challengeId||c.status!=='pending')return c;
                    const updated={...c,status:'active',opponentBaseline:stats.tasksCompleted,startDate:now,endDate:now+(c.durationDays*24*60*60*1000),acceptedAt:now,opponentEloSnapshot:Math.max(0,elo||0)};
                    if(FB.isReady()){FB.writeInbox(c.challenger,'challenges',challengeId,updated);FB.deleteInbox(user,'challenges',challengeId);}
                    writeSocial(c.challenger,d=>{if(!d.challenges)d.challenges=[];d.challenges=d.challenges.map(dc=>dc.id===challengeId?updated:dc);return d;});
                    writeSocial(user,d=>{if(!d.challenges)d.challenges=[];d.challenges=d.challenges.map(dc=>dc.id===challengeId?updated:dc);return d;});
                    return updated;

            const declineChallenge=async(challengeId)=>{
                setChallenges(prev=>prev.filter(c=>c.id!==challengeId));
                if(FB.isReady())await FB.deleteInbox(user,'challenges',challengeId);
                writeSocial(user,d=>{d.challenges=(d.challenges||[]).filter(c=>c.id!==challengeId);return d;});
            };

            // ── IMPROVED AI ELO ENGINE ──
            // Factors considered:
            //   1. Standard Elo expected score (Glicko-inspired)
            //   2. K-factor scales with: challenge difficulty, match closeness, and whether player is provisional (<10 challenges)
            //   3. Streak & tier bonuses add nuance so high-tier winners earn more
            //   4. Upset multiplier: beating a much stronger opponent gives bonus ELO
            //   5. Domination bonus: winning by a large margin adds extra
            //   6. Minimum gain/loss floors differ by rating bracket (newcomers gain more, elites gain less)
            const aiChallengeEloDelta=(myElo,opponentElo,resultScore,challenge,myProgress,theirProgress,myWinsTotal=0)=>{
                if(resultScore===0.5)return{delta:0,reason:'No result — 0 ELO change'};
                const isWin=resultScore===1;
                // ── 1. Expected probability (standard Elo) ──
                const expected=1/(1+Math.pow(10,(opponentElo-myElo)/400));
                // ── 2. Challenge difficulty score ──
                const goalFactor=Math.min(20,Math.round((challenge.taskGoal||1)/10));
                const daysFactor=Math.min(15,Math.round((challenge.durationDays||1)/2));
                const difficultyScore=goalFactor+daysFactor; // 0–35
                // ── 3. Dynamic K-factor ──
                // Provisional players (< 15 wins) get higher K so they calibrate quickly
                const isProvisional=(myWinsTotal||0)<15;
                const baseK=isProvisional?40:24;
                const k=Math.min(60,baseK+Math.round(difficultyScore*0.6));
                // ── 4. Core Elo delta ──
                const core=Math.round(k*(resultScore-expected));
                // ── 5. Margin of victory bonus/penalty ──
                const totalTasks=Math.max(1,challenge.taskGoal||1);
                const margin=myProgress-theirProgress;
                const marginPct=Math.abs(margin)/totalTasks;
                const marginBonus=isWin?Math.round(marginPct*12):0;
                const marginPenalty=!isWin?Math.round(marginPct*8):0;
                // ── 6. Upset multiplier (beating a stronger opponent) ──
                const eloDiff=opponentElo-myElo;
                const upsetBonus=isWin&&eloDiff>100?Math.min(18,Math.round(eloDiff/60)):0;
                // ── 7. Floor / ceiling ──
                // Winners always gain at least 6 (provisional: 12), losers always lose at least 4
                const rawDelta=isWin
                    ?(Math.max(isProvisional?12:6,core+marginBonus+upsetBonus))
                    :(Math.min(isProvisional?-10:-4,core-marginPenalty));
                // ── 8. High-ELO dampening (prevents runaway leaders) ──
                const dampened=myElo>1500?Math.round(rawDelta*0.85):rawDelta;
                const delta=Math.round(Math.max(isWin?6:-60,Math.min(isWin?60:-4,dampened)));
                const reason=`K=${k} | Expected=${(expected*100).toFixed(0)}% | Margin=${margin}/${totalTasks} | Upset+${upsetBonus} | ${isProvisional?'Provisional':'Established'}`;
                return{delta,reason};
            };

            const resolveChallengeOutcome=(challenge,now)=>{
                const cp=Math.max(0,challenge.challengerProgress||0);
                const op=Math.max(0,challenge.opponentProgress||0);
                const goal=Math.max(1,challenge.taskGoal||1);
                const reachedGoal=cp>=goal||op>=goal;
                const timedOut=now>=Number(challenge.endDate||0);
                if(!reachedGoal&&!timedOut)return null;
                // ── ONLY TOP 1 WINS ── exact tie → challenger wins (advantage to challenger)
                const winner=cp>op?challenge.challenger:op>cp?challenge.opponent:cp===op?challenge.challenger:'tie';
                const isWinner=winner===user;
                const challengerElo=Math.max(0,challenge.challengerEloSnapshot||0);
                const opponentElo=Math.max(0,challenge.opponentEloSnapshot||0);
                const challengerScore=winner===challenge.challenger?1:0; // no ties award
                const opponentScore=winner===challenge.opponent?1:0;
                const challengerCalc=aiChallengeEloDelta(challengerElo,opponentElo,challengerScore,challenge,cp,op);
                const opponentCalc=aiChallengeEloDelta(opponentElo,challengerElo,opponentScore,challenge,op,cp);
                const eloAwarded={challenger:challengerCalc.delta,opponent:opponentCalc.delta};
                const eloReason=`${challengerCalc.reason}`;
                // Track prestige milestone for challenge winner
                if(isWinner&&(challenge.status!=='completed')){
                    updatePrestigeMilestones('challenge_win',1);
                    showToast(`🏆 You won the challenge against ${winner===challenge.challenger?challenge.opponent:challenge.challenger}! Prestige progress updated.`,'success',6000);
                }
                return {
                    ...challenge,
                    status:'completed',
                    winner,
                    completedAt:now,
                    eloAwarded,
                    eloReason
                };
            };

            const updateChallengeProgress=()=>{
                const now=getTrustedTime();
                setChallenges(prev=>prev.map(c=>{
                    if(c.status!=='active')return c;
                    let updated={...c};
                    if(c.challenger===user)updated.challengerProgress=Math.max(0,stats.tasksCompleted-(c.challengerBaseline??0));
                    if(c.opponent===user)updated.opponentProgress=Math.max(0,stats.tasksCompleted-(c.opponentBaseline??stats.tasksCompleted));

                    const outcome=resolveChallengeOutcome(updated,now);
                    const finalChallenge=outcome||updated;
                    const other=c.challenger===user?c.opponent:c.challenger;

                    if(FB.isReady())FB.writeInbox(other,'challenges',c.id,finalChallenge).catch(()=>{});
                    writeSocial(other,d=>{if(!d.challenges)d.challenges=[];d.challenges=d.challenges.map(dc=>dc.id===c.id?finalChallenge:dc);return d;});
                    return finalChallenge;
                }));
            };

            const formatChallengeTimeLeft=(endDate)=>{
                const ms=endDate-getTrustedTime();if(ms<=0)return'Ended';
                const d=Math.floor(ms/86400000),h=Math.floor((ms%86400000)/3600000),m=Math.floor((ms%3600000)/60000);
                if(d>0)return`${d}d ${h}h left`;if(h>0)return`${h}h ${m}m left`;return`${m}m left`;
            };

            // ── DAILY QUESTS ENGINE ──
            // ── DAILY QUEST POOL — Tier-scaled, accurate progress tracking ──
            // Each quest has an optional minTier and tierScale: the target is multiplied by
            // Math.max(1, tierScale * playerTier) so quests get harder as players advance.
            const QUEST_POOL=[
                // Task completion quests
                {id:'q_tasks1', icon:'⚡',title:'Quick Start',      desc:'Complete 1 task today',         type:'tasks',  target:1,  xp:60,  coins:30},
                {id:'q_tasks3', icon:'✅',title:'Task Trio',        desc:'Complete 3 tasks today',        type:'tasks',  target:3,  xp:150, coins:75},
                {id:'q_tasks5', icon:'🎯',title:'Five Star Day',    desc:'Complete 5 tasks today',        type:'tasks',  target:5,  xp:250, coins:120},
                {id:'q_tasks7', icon:'💎',title:'Productivity Pro', desc:'Complete 7 tasks today',        type:'tasks',  target:7,  xp:380, coins:180,minTier:4},
                // Difficulty-based
                {id:'q_hardtask',icon:'💪',title:'Hard Charger',   desc:'Complete 1 hard/extreme task',  type:'hard_task',target:1, xp:200, coins:100},
                {id:'q_extreme', icon:'🔥',title:'Extreme Force',  desc:'Complete 2 extreme tasks',       type:'extreme_task',target:2,xp:320,coins:160,minTier:6},
                // Streak & login
                {id:'q_streak',  icon:'🔥',title:'Streak Keeper',  desc:'Maintain your daily streak',    type:'streak', target:1,  xp:100, coins:50},
                {id:'q_login',   icon:'🌟',title:'Daily Check-In', desc:'Log in and stay active',        type:'login',  target:1,  xp:40,  coins:20},
                // Focus session

                {id:'q_focus2',  icon:'🧘',title:'Deep Worker',    desc:'Complete 2 focus sessions',     type:'focus',  target:2,  xp:300, coins:150,minTier:5},
                // Wheel

                // Coin earning
