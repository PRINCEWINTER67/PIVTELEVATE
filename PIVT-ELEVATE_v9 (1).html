                {id:'q_coins500',icon:'💎',title:'Coin Hoarder',   desc:'Earn 500 coins from tasks',     type:'earn_coins',target:500,xp:220,coins:100,minTier:3},
                // Shop visit
                {id:'q_shop',    icon:'🛒',title:'Window Shopper', desc:'Visit the shop',                type:'visit_shop',target:1,xp:50, coins:25},
                // Habit
                {id:'q_habit',   icon:'📋',title:'Habit Builder',  desc:'Complete a daily habit',        type:'habit_done',target:1,xp:130,coins:65},
                // Goal progress
                {id:'q_goal',    icon:'🏆',title:'Goal Chaser',    desc:'Add progress to a goal',        type:'goal_progress',target:1,xp:110,coins:55},
            ];

            const getTodayKey=()=>new Date().toDateString();

            const generateDailyQuests=(today,currentTier=0)=>{
                // Filter by tier — don't show quests requiring a higher tier
                const available=QUEST_POOL.filter(q=>!q.minTier||currentTier>=(q.minTier));
                // Seeded shuffle based on date + tier for daily variety
                const seed=today.split('').reduce((a,c)=>a+c.charCodeAt(0),0)+currentTier*7;
                const rng=(n)=>{let x=Math.sin(seed+n*137.508)*10000;return x-Math.floor(x);};
                const shuffled=[...available].sort((a,b)=>rng(a.id.length+a.xp)-rng(b.id.length+b.xp));
                // Pick 3 quests with no overlapping primary type
                const picked=[];const usedTypes=new Set();
                for(const q of shuffled){
                    const baseType=q.type.split('_')[0]; // group 'hard_task' and 'extreme_task' together as 'hard/extreme'
                    const groupKey=q.type==='hard_task'||q.type==='extreme_task'?'difficulty':q.type==='focus'||q.type==='focus2'?'focus':baseType;
                    if(!usedTypes.has(groupKey)){picked.push(q);usedTypes.add(groupKey);}
                    if(picked.length===3)break;
                }
                return picked.length>=3?picked.slice(0,3):QUEST_POOL.slice(0,3);
            };

            const loadOrRefreshDailyQuests=()=>{
                if(!user)return;
                const today=getTodayKey();
                const stored=S.get(`user-${user}-daily-quests`);
                if(stored?.value){
                    try{
                        const d=JSON.parse(stored.value);
                        if(d.date===today){
                            // Regenerate _ready flags for auto-ready quest types (in case of page refresh)
                            const ready={...(d._ready||{})};
                            if(d.quests)d.quests.forEach(q=>{
                                if(q.type==='login')ready['login']=true;
                                if(q.type==='streak'&&stats.currentStreak>0)ready['streak']=true;
                            });
                            setDailyQuestsData({...d,_ready:ready});
                            return;
                        }
                    }catch(e){}
                }
                // New day — generate fresh quests
                const quests=generateDailyQuests(today,tier);
                // Auto-ready login quest and streak quest (they're always claimable once you're in)
                const autoReady={};
                quests.forEach(q=>{
                    if(q.type==='login')autoReady['login']=true;
                    if(q.type==='streak'&&stats.currentStreak>0)autoReady['streak']=true;
                });
                const fresh={date:today,quests,claimed:[],_ready:autoReady};
                setDailyQuestsData(fresh);
                S.set(`user-${user}-daily-quests`,JSON.stringify(fresh));
            };

            const getDailyQuestProgress=(quest)=>{
                const today=new Date(getTrustedTime()).toDateString();
                if(quest.type==='tasks'){
                    const done=(tasks||[]).filter(t=>t.completed&&t.completedAt&&new Date(t.completedAt).toDateString()===today).length;
                    return{progress:Math.min(done,quest.target),target:quest.target};
                }
                if(quest.type==='hard_task'){
                    const done=(tasks||[]).filter(t=>t.completed&&t.completedAt&&new Date(t.completedAt).toDateString()===today&&(t.difficulty==='hard'||t.difficulty==='extreme')).length;
                    return{progress:Math.min(done,quest.target),target:quest.target};
                }
                if(quest.type==='extreme_task'){
                    const done=(tasks||[]).filter(t=>t.completed&&t.completedAt&&new Date(t.completedAt).toDateString()===today&&t.difficulty==='extreme').length;
                    return{progress:Math.min(done,quest.target),target:quest.target};
                }
                if(quest.type==='streak')return{progress:stats.currentStreak>0?1:0,target:1};
                if(quest.type==='login')return{progress:1,target:1};
                if(quest.type==='earn_coins'){
                    // Count coins earned today from ALL reward sources
                    const earned=(activityLog||[]).filter(a=>{
                        if(!a.timestamp||new Date(a.timestamp).toDateString()!==today)return false;
                        return a.type==='task_completed'||a.type==='habit_completed'||a.type==='goal_completed'||a.type==='focus_completed'||a.type==='wheel_won';
                    }).reduce((s,a)=>s+(a.details?.coins||a.details?.coinReward||0),0);
                    return{progress:Math.min(earned,quest.target),target:quest.target};
                }
                if(quest.type==='habit_done'){
                    // logActivity uses 'habit_completed' (not 'habit_checked')
                    const done=(activityLog||[]).filter(a=>a.type==='habit_completed'&&a.timestamp&&new Date(a.timestamp).toDateString()===today).length;
                    return{progress:Math.min(done,quest.target),target:quest.target};
                }
                if(quest.type==='goal_progress'){
                    // Count any goal_progress updates OR goal completions today
                    const done=(activityLog||[]).filter(a=>(a.type==='goal_progress'||a.type==='goal_completed')&&a.timestamp&&new Date(a.timestamp).toDateString()===today).length;
                    return{progress:Math.min(done,quest.target),target:quest.target};
                }
                if(quest.type==='focus'||quest.type==='focus2'){
                    // Count focus sessions completed today from activity log
                    const done=(activityLog||[]).filter(a=>a.type==='focus_completed'&&a.timestamp&&new Date(a.timestamp).toDateString()===today).length;
                    return{progress:Math.min(done,quest.target),target:quest.target};
                }
                // wheel, visit_shop — tracked via _ready flag (activity-tracked)
                return{progress:0,target:quest.target};
            };

            const claimDailyQuest=(questId)=>{
                if(dailyQuestsData.claimed.includes(questId))return;
                const quest=dailyQuestsData.quests.find(q=>q.id===questId);
                if(!quest)return;
                const prog=getDailyQuestProgress(quest);
                // Activity-tracked quests require the _ready flag (wheel, shop only — focus is auto-claimed)
                const activityTracked=quest.type==='wheel'||quest.type==='visit_shop';
                if(activityTracked&&!(dailyQuestsData._ready&&dailyQuestsData._ready[quest.type]))return;
                // For all other quests: require progress target met
                if(!activityTracked&&prog.progress<prog.target)return;
                const newClaimed=[...dailyQuestsData.claimed,questId];
                const updated={...dailyQuestsData,claimed:newClaimed};
                setDailyQuestsData(updated);
                S.set(`user-${user}-daily-quests`,JSON.stringify(updated));
                setXp(p=>p+quest.xp);
                setTotalXp(p=>p+quest.xp);
                setCoins(p=>p+quest.coins);
                showCoinAnim(quest.coins);
                showXpAnim(quest.xp);
                logActivity('daily_quest_claimed',{questId,xp:quest.xp,coins:quest.coins});
            };

            const markQuestProgress=(type)=>{
                // Called when user completes focus session, spins wheel, or visits shop
                const today=getTodayKey();
                if(dailyQuestsData.date!==today)return;
                const quest=dailyQuestsData.quests.find(q=>q.type===type);
                if(!quest||dailyQuestsData.claimed.includes(quest.id))return;
                // Mark as ready-to-claim in both state AND localStorage.
                // Without the localStorage write, _ready is lost on page refresh before claiming.
                const updated={...dailyQuestsData,_ready:{...(dailyQuestsData._ready||{}),[type]:true}};
                setDailyQuestsData(updated);
                try{S.set(`user-${user}-daily-quests`,JSON.stringify(updated));}catch(e){}
            };

            // ── TRADE FUNCTIONS ──

            const getRarityLevel=(itemId)=>{const item=shopItems.find(i=>i.id===itemId);return item?item.rarity:0;};
            const getItemTierRequirement=(itemId)=>{const item=shopItems.find(i=>i.id===itemId);return Math.max(0,Math.min(41,Number(item?.minT||0)));};
            const isItemWithinTradeTierWindow=(itemId,baseTier=tier)=>Math.abs(getItemTierRequirement(itemId)-Math.max(0,Math.min(41,Number(baseTier||0))))<=1;

            const createTradeOffer=async(friendUsername,myItemId,theirItemId)=>{
                if(!myItemId){showToast('Select an item you want to offer.','info');return;}
                if(!theirItemId){showToast('Select an item you want to request.','info');return;}
                if(!isItemWithinTradeTierWindow(myItemId)||!isItemWithinTradeTierWindow(theirItemId)){showToast('🔒 Trade visibility rule: you can only trade items within 1 tier above or below your current tier.','warning');return;}
                if(Math.abs(getRarityLevel(myItemId)-getRarityLevel(theirItemId))>1){showToast('⚖️ Trade is too uneven — items must be within 1 rarity level.','info');return;}
                if(!owned.includes(myItemId)){showToast('❌ You no longer own that item!','error');return;}
                const trade={
                    id:getTrustedTime().toString(36)+Math.random().toString(36).slice(2,5),
                    from:user,to:friendUsername,offerItem:myItemId,requestItem:theirItemId,
                    timestamp:getTrustedTime(),status:'pending'
                };
                let sent=false;
                if(FB.isReady()){const ok=await FB.writeInbox(friendUsername,'trades',trade.id,trade);if(ok)sent=true;}
                const lsOk=writeSocial(friendUsername,d=>{
                    if(!d.tradeOffers)d.tradeOffers=[];
                    d.tradeOffers=d.tradeOffers.filter(t=>t.id!==trade.id);
                    d.tradeOffers.push(trade);return d;
                });
                if(lsOk)sent=true;
                if(sent)showToast(`🤝 Trade offer sent to ${friendUsername}!`,'success');
                else showToast('⚠️ Could not reach that player. Try again.','error');
            };

            const acceptTrade=async(trade)=>{
                if(!owned.includes(trade.requestItem)){showToast('❌ You no longer own the item they want.','error');return;}
                setOwned(prev=>[...prev.filter(i=>i!==trade.requestItem),trade.offerItem]);
                setTradeOffers(prev=>prev.filter(t=>t.id!==trade.id));
                if(FB.isReady()){
                    await FB.deleteInbox(user,'trades',trade.id);
                    await FB.writeInbox(trade.from,'tradeCompleted',trade.id,{tradeId:trade.id,receivedItem:trade.requestItem,sentItem:trade.offerItem});
                }
                writeSocial(trade.from,d=>{if(!d.owned)d.owned=[];d.owned=[...(d.owned.filter(i=>i!==trade.offerItem)),trade.requestItem];return d;});
                writeSocial(user,d=>{if(d.tradeOffers)d.tradeOffers=d.tradeOffers.filter(t=>t.id!==trade.id);return d;});
                // Also update sender's main game data so their inventory reflects the trade
                try{
                    const senderRaw=S.get(`user-${trade.from}-data`);
                    if(senderRaw?.value){
                        const senderData=JSON.parse(senderRaw.value);
                        senderData.owned=(senderData.owned||[]).filter(i=>i!==trade.offerItem);
                        if(!senderData.owned.includes(trade.requestItem))senderData.owned.push(trade.requestItem);
                        S.set(`user-${trade.from}-data`,JSON.stringify(senderData));
                        S.set(`user-${trade.from}-data-backup`,JSON.stringify(senderData));
                    }
                }catch(e){console.error('Trade sender data update failed:',e);}
                logActivity('trade_completed',{with:trade.from,gave:trade.requestItem,received:trade.offerItem});
                showToast('✅ Trade completed!','success');
            };

            const rejectTrade=async(tradeId)=>{
                setTradeOffers(prev=>prev.filter(t=>t.id!==tradeId));
                if(FB.isReady())await FB.deleteInbox(user,'trades',tradeId);
                writeSocial(user,d=>{if(d.tradeOffers)d.tradeOffers=d.tradeOffers.filter(t=>t.id!==tradeId);return d;});
            };

            // Legacy aliases so nothing else in the codebase breaks
            const readFriendData=(uname)=>{try{const r=S.get(`user-${uname}-data`);return r?.value?JSON.parse(r.value):null;}catch(e){return null;}};
            const writeFriendData=(uname,fn)=>{try{const e=readFriendData(uname)||{};S.set(`user-${uname}-data`,JSON.stringify(fn(e)));return true;}catch(e){return false;}};


            // ========================
            // LEADERBOARD
            // ========================
            const updateLeaderboard=async()=>{
                const allUsers=[];const seen=new Set();
                // Firebase global leaderboard
                if(FB.isReady()){
                    try{
                        const profiles=await FB.getAllProfiles();
                        if(profiles){
                            Object.values(profiles).forEach(p=>{
                                if(!p.username)return;
                                allUsers.push({username:p.username,totalXp:Math.max(0,p.totalXp||0),tier:Math.min(41,Math.max(0,p.tier||0)),elo:Math.max(0,p.elo||0),avatar:p.avatar||'',level:1,tasksCompleted:Math.max(0,p.tasksCompleted||0),currentStreak:Math.max(0,p.streak||0),global:true});
                                seen.add(p.username.toLowerCase());
                            });
                        }
                    }catch(e){}
                }
                // Local users (same device)
                try{
                    const keys=[];
                    for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key&&key.endsWith('-data')&&!key.endsWith('-data-backup'))keys.push(key);}
                    keys.forEach(key=>{
                        try{
                            const raw=localStorage.getItem(key);if(!raw)return;
                            const data=JSON.parse(raw);

                    allday:3*60*60*1000,
                };
                return minimums[dur]??0;

            const scheduleTaskReminder=(task)=>{

                    const dueTime=new Date(task.dueDate).getTime();

            const addTask=()=>{

                if(!sanitizedTitle){
                    showToast('❌ Task title cannot be empty','error');

                }
                
                if(sanitizedTitle.length>200){
                    showToast('❌ Task title too long (max 200 characters)','error');
                    return;
                }
                
                // Anti-spam: Check for rapid task creation
                const now=getTrustedTime();
                const recentTasks=tasks.filter(t=>now-t.createdAt<5000);
                if(recentTasks.length>=3){
                    showToast('⚠️ Slow down! Wait a few seconds before creating more tasks.','warning');
                    return;
                }
                
                // Anti-duplicate: Check for exact duplicate titles (active tasks)
                const titleLower=sanitizedTitle.toLowerCase();
                const duplicateTask=tasks.find(t=>t.title.toLowerCase()===titleLower&&!t.completed);
                if(duplicateTask){
                    setDeleteConfirm({
                        message:`⚠️ You already have an active task called "${sanitizedTitle}"\n\nCreate anyway?`,
                        onConfirm:()=>{
                            const now2=getTrustedTime();
                            setTasks(prev=>[...prev,{
                                id:now2,
                                ...newTask,
                                title:sanitizedTitle,
                                xpRew:calcXp(newTask.difficulty,newTask.duration),
                                coinRew:calcCoins(newTask.difficulty),
                                completed:false,
                                createdAt:now2,
                                canCompleteAt:now2+getMinDuration(newTask.duration),
                                dueDate:normalizeDueDate(newTask.dueDate),
                                priority:newTask.priority||3
                            }]);
                            setNewTask({title:'',difficulty:'medium',duration:'1hr',category:'personal',dueDate:'',priority:3});
                            logActivity('task_created',{task:sanitizedTitle,priority:newTask.priority});
                        }
                    });
                    return;
                }
                
                // ── RECONSTRUCTION EXPLOIT BLOCK ──
                // Hard-block: cannot recreate a task with the same title within 24h of completing or deleting it
                const recentlyCompleted=tasks.some(t=>t.completed&&t.completedAt&&now-t.completedAt<TITLE_COOLDOWN_RANKED&&t.title.toLowerCase()===titleLower);
                const recentlyDeleted=(deletedTasks||[]).some(t=>t.deletedAt&&now-t.deletedAt<TITLE_COOLDOWN_RANKED&&t.title.toLowerCase()===titleLower);
                if(recentlyCompleted||recentlyDeleted){
                    showToast(`⏰ Task Cooldown — 24 Hour Block\n\n"${sanitizedTitle}" was ${recentlyCompleted?'completed':'deleted'} recently.\n\nYou must wait 24 hours before creating a new task with the same title.\n\nThis prevents farming the same task repeatedly.`,'success');return;
                }
                
                // Validate due date — HARD BLOCK, no confirm bypass allowed
                if(newTask.dueDate){
                    const dueTime=(getSafeDate(newTask.dueDate)||new Date(0)).getTime();
                    if(dueTime<now){
                        showToast('❌ Due date cannot be in the past.\n\nSet a future date or leave blank.\nBackdating tasks is not allowed.','error');return;
                    }
                }
                
                const newTaskObj={
                    id:now,
                    ...newTask,
                    title:sanitizedTitle,
                    xpRew:calcXp(newTask.difficulty,newTask.duration),
                    coinRew:calcCoins(newTask.difficulty),
                    completed:false,
                    createdAt:now,
                    canCompleteAt:now+getMinDuration(newTask.duration),
                    dueDate:normalizeDueDate(newTask.dueDate),
                    priority:newTask.priority||3
                };
                setTasks([...tasks,newTaskObj]);
                scheduleTaskReminder(newTaskObj);
                setNewTask({title:'',difficulty:'medium',duration:'1hr',category:'personal',dueDate:'',priority:3});
                
                // Log activity
                logActivity('task_created',{task:sanitizedTitle,priority:newTask.priority});
            };

            const getCountdown=(dueDate)=>{
                if(!dueDate)return null;
                const due=getSafeDate(dueDate);
                if(!due)return null;
                const diffMs=due.getTime()-getTrustedTime();
                const overdue=diffMs<0;
                const absSeconds=Math.floor(Math.abs(diffMs)/1000);
                const days=Math.floor(absSeconds/86400);
                const hours=Math.floor((absSeconds%86400)/3600);
                const minutes=Math.floor((absSeconds%3600)/60);
                const seconds=absSeconds%60;
                return {overdue,days,hours,minutes,seconds,totalSeconds:absSeconds};
            };

            const formatCountdown=(countdown)=>{
                if(!countdown)return'';
                const parts=[];
                if(countdown.days>0)parts.push(`${countdown.days}d`);
                if(countdown.hours>0||countdown.days>0)parts.push(`${countdown.hours}h`);
                if(countdown.minutes>0||countdown.days>0||countdown.hours>0)parts.push(`${countdown.minutes}m`);
                parts.push(`${countdown.seconds}s`);
                return parts.slice(0,4).join(' ');
            };

            const getPriorityColor=(priority)=>{
                if(priority===1)return'bg-green-500';
                if(priority===2)return'bg-lime-500';
                if(priority===3)return'bg-yellow-500';
                if(priority===4)return'bg-orange-500';
                if(priority===5)return'bg-red-500';
                return'bg-gray-500';
            };

            const getPriorityLabel=(priority)=>{
                if(priority===1)return'Low';
                if(priority===2)return'Medium-Low';
                if(priority===3)return'Medium';
                if(priority===4)return'High';
                if(priority===5)return'Critical';
                return'None';
            };

            const getSortedTasks=()=>{
                const sorted=[...tasks];
                switch(taskSort){
                    case'dueDate':
                        return sorted.sort((a,b)=>{
                            if(a.completed!==b.completed)return a.completed?1:-1;
                            if(!a.dueDate&&!b.dueDate)return b.createdAt-a.createdAt;
                            if(!a.dueDate)return 1;
                            if(!b.dueDate)return -1;
                            return new Date(a.dueDate)-new Date(b.dueDate);
                        });
                    case'created':
                        return sorted.sort((a,b)=>{
                            if(a.completed!==b.completed)return a.completed?1:-1;
                            return b.createdAt-a.createdAt;
                        });
                    case'priority':
                    default:
                        return sorted.sort((a,b)=>{
                            if(a.completed!==b.completed)return a.completed?1:-1;
                            const priorityA=a.priority||3;
                            const priorityB=b.priority||3;
                            if(priorityA!==priorityB)return priorityB-priorityA;
                            if(a.dueDate&&!b.dueDate)return -1;
                            if(!a.dueDate&&b.dueDate)return 1;
                            if(a.dueDate&&b.dueDate){
                                const dateA=new Date(a.dueDate).getTime();
                                const dateB=new Date(b.dueDate).getTime();
                                if(dateA!==dateB)return dateA-dateB;
                            }
                            return b.createdAt-a.createdAt;
                        });
                }
            };

            const completeTask=(id)=>{
                const t=tasks.find(x=>x.id===id);
                if(!t||t.completed)return;
                
                const now=getTrustedTime();
                
                // Anti-cheat: Check if minimum time has passed
                if(t.canCompleteAt&&now<t.canCompleteAt){
                    const msLeft=t.canCompleteAt-now;
                    const minsLeft=Math.ceil(msLeft/60000);
                    const secLeft=Math.ceil(msLeft/1000);
                    const display=minsLeft>=2?`${minsLeft} more minutes`:secLeft>60?`${minsLeft} more minute`:
                        `${secLeft} more seconds`;
                    showToast(`⏰ Task Not Ready Yet\n\nThis task requires a minimum work time before it can be marked complete.\n\nTime remaining: ${display}\n\nThis prevents quick-completing long tasks without actually doing them.`,'warning');return;
                }
                
                // Anti-spam: Detect rapid task completion (max 5 tasks per minute)
                const recentCompletions=tasks.filter(x=>x.completed&&x.completedAt&&now-x.completedAt<60000);
                const completionRate=recentCompletions.length;
                const maxAllowed=Math.max(3,5-Math.floor(completionRate/2));
                if(completionRate>=maxAllowed){
                    showToast(`⚠️ Slow down! You can complete max ${maxAllowed} tasks per minute.\n\nTake a break and come back in a moment.`,'warning');return;
                }
                
                // Anti-spam: Detect suspicious patterns (same title completed multiple times quickly)
                const sameTaskCompletions=tasks.filter(x=>
                    x.completed&&
                    x.completedAt&&
                    now-x.completedAt<300000&&
                    x.title.toLowerCase()===t.title.toLowerCase()
                );
                if(sameTaskCompletions.length>=3){
                    showToast(`⚠️ Suspicious Activity Detected\n\nYou've completed "${t.title}" ${sameTaskCompletions.length} times in 5 minutes.\n\nThis looks like farming. Please create unique tasks.`,'warning');return;
                }
                
                // Anti-spam: Check task age (can't complete task within 10 seconds of creation unless it's instant)
                if(now-t.createdAt<10000&&t.duration!=='instant'){
                    showToast(`⚠️ Task created too recently!\n\nWait at least 10 seconds before completing non-instant tasks.`,'warning');return;
                }
                
                // Anti-abuse: Hard hourly coin earning ceiling (tasks only)
                if(getHourlyTaskCoins()>=MAX_HOURLY_TASK_COINS){
                    showToast(`🛑 Hourly Coin Limit Reached\n\nYou've earned the maximum ${MAX_HOURLY_TASK_COINS.toLocaleString()} coins from tasks this hour.\n\nThis limit resets on a rolling 60-minute window. Come back soon!`,'warning');return;
                }

                // Trigger completion animation
                setTaskAnimation(prev=>({...prev,[id]:'complete'}));
                setTimeout(()=>{
                    setTaskAnimation(prev=>({...prev,[id]:null}));
                },500);
                
                const xpMult=specialEvent.doubleXpWeekend?2:1;
                const coinMult=specialEvent.goldenHour?5:1;
                // Apply ALL multipliers at completion (base reward was stored raw — no double-dipping)
                const rewardXp=Math.min(MAX_XP_PER_TASK,Math.max(1,Math.floor(t.xpRew*getSafeXpBoost()*xpMult)));
                const rewardCoins=Math.min(MAX_COINS_PER_TASK,Math.max(1,Math.floor(t.coinRew*getSafeCoinBoost()*coinMult)));
                const newXp=xp+rewardXp;
                const newTotalXp=totalXp+rewardXp;
                const newCoins=coins+rewardCoins;
                const req=getLvlXp();

                // ── RANKED POINTS ──
                const curWk=getCurrentWeekKey();
                const ptsToday=getRankedPtsToday(tasks);
                const curWeekPts=weeklyRankedKey===curWk?weeklyRankedPts:0;
                const rawPts=calcRankedPoints(t.difficulty,t.duration);
                // No ranked points if: daily cap reached, weekly cap reached, same title was earned pts in last 24h
                const titleAlreadyEarnedToday=tasks.some(x=>x.completed&&x.completedAt&&now-x.completedAt<TITLE_COOLDOWN_RANKED&&x.id!==id&&x.title.toLowerCase()===t.title.toLowerCase()&&(x.rankedPtsEarned||0)>0);
                const remainingToday=Math.max(0,MAX_RANKED_PTS_PER_DAY-ptsToday);
                const remainingWeek=Math.max(0,MAX_RANKED_PTS_PER_WEEK-curWeekPts);
                const earnedPts=(remainingToday<=0||remainingWeek<=0||titleAlreadyEarnedToday)?0:Math.min(rawPts,remainingToday,remainingWeek);
                const newWeeklyPts=Math.min(MAX_RANKED_PTS_PER_WEEK,curWeekPts+earnedPts);

                setTasks(tasks.map(x=>x.id===id?{...x,completed:true,completedAt:now,rankedPtsEarned:earnedPts}:x));
                setCoins(newCoins);
                if(weeklyRankedKey!==curWk)setWeeklyRankedKey(curWk);
                if(earnedPts>0){
                    setWeeklyRankedPts(newWeeklyPts);
                    setTimeout(()=>addAnim(`+${earnedPts}⚔️`,'#818cf8','ranked','sm'),200);
                    // Check if Infinity rank reached this week (500 pts needed in old scale, 100 in new)
                    if(newWeeklyPts>=MAX_RANKED_PTS_PER_WEEK){
                        updatePrestigeMilestones('infinity_week',1);
                        updatePrestigeMilestones('weekly_pts_update',newWeeklyPts);
                    }
                }
                // Track prestige milestones for task type
                updatePrestigeMilestones('task_completed',1);
                if(t.difficulty==='extreme')updatePrestigeMilestones('extreme_task',1);
                if(t.difficulty==='hard'||t.difficulty==='extreme')updatePrestigeMilestones('hard_task',1);

                recordCoinEarn(rewardCoins);  // Track for hourly ceiling
                showCoinAnim(rewardCoins);
                showXpAnim(rewardXp);
                playSound('complete');
                
                // Log activity
                logActivity('task_completed',{task:t.title,xp:rewardXp,coins:rewardCoins,difficulty:t.difficulty,duration:t.duration,event:specialEvent.label,rankedPts:earnedPts});

                const today=new Date(getTrustedTime()).toDateString();
                const yesterday=new Date(getTrustedTime()-86400000).toDateString();
                let newStreak=1;
                if(stats.lastTaskDate===today)newStreak=stats.currentStreak;
                else if(stats.lastTaskDate===yesterday)newStreak=stats.currentStreak+1;
                const newLong=Math.max(newStreak,stats.longestStreak);
                setStats(p=>({...p,tasksCompleted:p.tasksCompleted+1,currentStreak:newStreak,longestStreak:newLong,lastTaskDate:today}));

                if(newStreak===7&&stats.currentStreak<7){setCoins(p=>p+100);setTimeout(()=>showCoinAnim(100),300)}
                else if(newStreak===14&&stats.currentStreak<14){setCoins(p=>p+250);setTimeout(()=>showCoinAnim(250),300)}
                else if(newStreak===30&&stats.currentStreak<30){setCoins(p=>p+1000);setTimeout(()=>showCoinAnim(1000),300)}
                else if(newStreak===100&&stats.currentStreak<100){setCoins(p=>p+5000);setTimeout(()=>showCoinAnim(5000),300)}

                // ── XP ADVANCEMENT LOOP ──
                // Handles multi-level overflow in a single task (boosters, huge rewards)
                {
                const _smul=(_s)=>1; // multiplier removed — xpPerLvl already scales with tier
                const _gS=(t)=>t<=6?1:t<=13?2:t<=20?3:t<=27?4:t<=34?5:6;
                let nXp=newXp,nLvl=lvl,nTier=tier,nSeason=season;
                let bonusCoins=0,didLevelUp=false,didTierUp=false;
                let seasonCompleteData=null,tierUpName='';
                let _lim=50;
                while(_lim > 0){ _lim--;
                  const _req=(tiers[Math.min(nTier,41)]||tiers[41]).xpPerLvl*_smul(nSeason);
                  if(nXp<_req)break;
                  const _rem=nXp-_req;
                  if(nLvl<5){
                    nLvl++;nXp=_rem;bonusCoins+=50;didLevelUp=true;
                  }else if(nTier<41){
                    const oldS=nSeason;
                    nTier++;nLvl=1;nXp=_rem;bonusCoins+=500;
                    nSeason=_gS(nTier);
                    didTierUp=true;tierUpName=tiers[nTier].name;
                    if(nSeason>oldS){
                      const bonus=seasonBonuses[oldS]||0;
                      bonusCoins+=bonus;
                      seasonCompleteData={oldSeason:oldS,newSeason:nSeason,bonus,
                        totalXp:newTotalXp,tasks:stats.tasksCompleted,streak:stats.currentStreak};
                    }
                  }else{
                    const _req2=(tiers[41]||tiers[41]).xpPerLvl*_smul(nSeason);
                    nXp=_req2;break;
                  }
                }
                setXp(nXp);
                setLvl(nLvl);
                setTier(nTier);
                setSeason(nSeason);
                setTotalXp(newTotalXp);
                if(bonusCoins>0)setCoins(p=>p+bonusCoins);
                if(didTierUp){
                  if(seasonCompleteData){
                    setShowSeasonComplete(seasonCompleteData);
                    setTimeout(()=>setShowSeasonComplete(null),10000);
                    logActivity('season_complete',{season:seasonCompleteData.oldSeason,bonus:seasonCompleteData.bonus});
                  }else{
                    setShowTierUp(true);
                    setTimeout(()=>setShowTierUp(false),5000);
                    logActivity('tier_up',{tier:tierUpName,coins:500});
                  }
                }else if(didLevelUp){
                  setShowLvlUp(true);
                  setTimeout(()=>setShowLvlUp(false),5000);
                  logActivity('level_up',{level:nLvl,tier:tiers[nTier].name,coins:50});
                }
                }
            };

                            return{prize,weight:Math.max(0.001,w)};
                        });

                        const _req=(tiers[Math.min(_tier,41)]||tiers[41]).xpPerLvl;

                        if(_lvl<5){_lvl++;_xp=_rem;_didLvlUp=true;setCoins(p=>p+50);}
                        else if(_tier<41){
                            const _ns=getCurrentSeason(_tier+1);const _os=getCurrentSeason(_tier);

                        }else{_xp=_req;break;}

                    setXp(_xp);setLvl(_lvl);setTier(_tier);
                    setTotalXp(prev=>prev+bonusXp);
                    if(_didLvlUp){setShowLvlUp(true);setTimeout(()=>setShowLvlUp(false),5000);logActivity('level_up',{level:_lvl,source:'focus'});}
                    if(_didTierUp&&!_didLvlUp){setShowTierUp(true);setTimeout(()=>setShowTierUp(false),5000);}
                }
                showXpAnim(bonusXp);

                // ── Auto-complete & auto-claim daily focus quests (handles both 'focus' and 'focus2') ──
                const today=getTodayKey();
                setDailyQuestsData(prev=>{
                    if(!prev||prev.date!==today)return prev;
                    // Track sessions completed today (increment counter)
                    const sessionsDoneToday=((prev._focusSessions||0)+1);
                    let updated={...prev,_focusSessions:sessionsDoneToday,_ready:{...(prev._ready||{}),focus:true}};
                    const toClaim=[];
                    // Check 'focus' quest (1 session needed)
                    const q1=prev.quests.find(q=>q.type==='focus'&&q.target===1);
                    if(q1&&!prev.claimed.includes(q1.id))toClaim.push(q1);
                    // Check 'focus2' quest (2 sessions needed)
                    const q2=prev.quests.find(q=>q.type==='focus'&&q.target===2);
                    if(q2&&!prev.claimed.includes(q2.id)&&sessionsDoneToday>=2)toClaim.push(q2);
                    if(toClaim.length===0){updated._ready={...updated._ready,focus:true};S.set(`user-${user}-daily-quests`,JSON.stringify(updated));return updated;}
                    const newClaimed=[...prev.claimed,...toClaim.map(q=>q.id)];
                    updated={...updated,claimed:newClaimed};
                    S.set(`user-${user}-daily-quests`,JSON.stringify(updated));
                    setTimeout(()=>{
                        toClaim.forEach((quest,idx)=>{
                            setTimeout(()=>{

                                logActivity('daily_quest_claimed',{questId:quest.id,xp:quest.xp,coins:quest.coins,source:'focus_auto'});
                            },idx*1000);
                        });

                    return updated;
                });

                showToast(`🎉 Focus Session Complete! +${bonusXp} XP · +${bonusCoins}💰 · Take a ${usedBreakMinutes}min break!`,'success',6000);

            const modWrite=async(username,updater)=>{

                    if(attempts[key]){
                        delete attempts[key];
                        localStorage.setItem('login_attempts',JSON.stringify(attempts));
                        addModLog('RESET_LOGIN_LOCK',`Cleared login lock for ${a.username}`);
                        modAlert(`✅ Login lock cleared for ${a.username}. They can now log in immediately.`);
                    }else{
                        modAlert(`ℹ️ ${a.username} has no active login lock — nothing to clear.`);
                    }
                }catch(e){modAlert('Error: '+e.message);}
            };
            const modOpenActivity=(a)=>{
                if(!isMod||user!=='__MOD__')return;
                setModViewingUser(a.username);
                setModTab('activity');
                addModLog('VIEW_ACTIVITY',`Opened activity log of ${a.username}`);
            };
            const modDeleteActivityEntry=(username,entryTimestamp)=>{
                if(!isMod||user!=='__MOD__')return;
                modConfirm(`[MOD] Delete this activity entry from ${username}?`,()=>{
                    try{
                        const raw=localStorage.getItem(`user-${username}-data`);
                        if(!raw)return modAlert('No game data found.');
                        const d=JSON.parse(raw);
                        const before=(d.activityLog||[]).length;
                        d.activityLog=(d.activityLog||[]).filter(e=>e.timestamp!==entryTimestamp);
                        const removed=before-d.activityLog.length;
                        d.__modBypass=true;
                        const payload=JSON.stringify(d);
                        localStorage.setItem(`user-${username}-data`,payload);
                        localStorage.setItem(`user-${username}-data-backup`,payload);
                        addModLog('DELETE_ACTIVITY',`Deleted ${removed} entry from ${username} (ts:${entryTimestamp})`);
                        modAlert(`✅ Deleted ${removed} entry from ${username}'s activity log.`);
                    }catch(e){modAlert('Error: '+e.message);}
                });
            };
            const modDeleteActivityByType=(username,type)=>{
                if(!isMod||user!=='__MOD__')return;
                modConfirm(`[MOD] Delete ALL "${type}" entries from ${username}'s activity log?`,()=>{
                    try{
                        const raw=localStorage.getItem(`user-${username}-data`);
                        if(!raw)return modAlert('No game data found.');
                        const d=JSON.parse(raw);
                        const before=(d.activityLog||[]).length;
                        d.activityLog=(d.activityLog||[]).filter(e=>e.type!==type);
                        const removed=before-d.activityLog.length;
                        d.__modBypass=true;
                        const payload=JSON.stringify(d);
                        localStorage.setItem(`user-${username}-data`,payload);
                        localStorage.setItem(`user-${username}-data-backup`,payload);
                        addModLog('DELETE_ACTIVITY_TYPE',`Deleted all "${type}" (${removed}) from ${username}`);
                        modAlert(`✅ Deleted ${removed} "${type}" entries from ${username}.`);
                    }catch(e){modAlert('Error: '+e.message);}
                });
            };
            const modClearModLog=()=>{
                if(!isMod||user!=='__MOD__')return;
                modConfirm('[MOD] Clear the entire mod action log? This cannot be undone.',()=>{
                    setModLog([]);
                    try{localStorage.removeItem('pivt-mod-log');}catch(e){}
                    addModLog('CLEAR_LOG','Mod action log cleared');
                });
            };

            // ── MODERATOR PANEL ──
            if(isMod){
                // ── Collect all accounts: local localStorage + Firebase profiles (cross-device) ──
                const allAccounts=[];
                void modRefreshKey; // eslint-disable-line — triggers recompute after mod writes
                const seenUsernames=new Set(); // dedup by lowercase username

                // 1. Local accounts (have full data: email, security events, etc.)
                try{
                    for(let i=0;i<localStorage.length;i++){
                        const k=localStorage.key(i);
                        if(k&&k.endsWith('-account')){
                            try{
                                const acc=JSON.parse(localStorage.getItem(k)||'{}');
                                const uname=acc.username||(k.startsWith('user-')?k.slice(5).replace(/-account$/,''):'?');
                                if(!uname||uname==='?')continue;
                                seenUsernames.add(uname.toLowerCase());
                                let gdata={coins:0,totalXp:0,tier:0,lvl:1,season:1,stats:{tasksCompleted:0,currentStreak:0},activeBoosters:[],activityLog:[]};
                                try{const raw=localStorage.getItem(`user-${uname}-data`);if(raw)gdata={...gdata,...JSON.parse(raw)};}catch(e){}
                                allAccounts.push({
                                    key:k,username:uname,email:acc.email||'—',
                                    createdAt:acc.createdAt,lastLogin:acc.lastLogin,
                                    status:acc.accountStatus||'active',
                                    loginCount:acc.loginCount||0,
                                    securityMode:acc.securityMode||'normal',
                                    securityEvents:acc.securityEvents||[],
                                    coins:gdata.coins||0,totalXp:gdata.totalXp||0,weeklyRankedPts:gdata.weeklyRankedPts||0,weeklyRankedKey:gdata.weeklyRankedKey||'',
                                    tier:gdata.tier||0,lvl:gdata.lvl||1,season:gdata.season||1,
                                    tasksCompleted:gdata.stats?.tasksCompleted||0,
                                    currentStreak:gdata.stats?.currentStreak||0,
                                    activeBoosters:(gdata.activeBoosters||[]).filter(b=>b.expires>getTrustedTime()),
                                    activityLog:(gdata.activityLog||[]).slice(0,5),
                                    isBanned:isBannedUser(uname),
                                    source:'local',
                                });
                            }catch(e){}
                        }
                    }
                }catch(e){}

                // 2. Firebase profiles (cross-device — every user who ever logged in with Firebase enabled)
                if(FB.isReady()&&Object.keys(modFbProfiles).length>0){
                    Object.entries(modFbProfiles).forEach(([fbUsername,p])=>{
                        if(!fbUsername||!p)return;
                        if(seenUsernames.has(fbUsername.toLowerCase()))return; // already have local data
                        seenUsernames.add(fbUsername.toLowerCase());
                        allAccounts.push({
                            key:`fb-${fbUsername}`,
                            username:p.username||fbUsername,
                            email:'— (other device)',
                            createdAt:null,
                            lastLogin:p.lastSeen?new Date(p.lastSeen).toISOString():null,
                            status:'active',
                            loginCount:0,
                            securityMode:'normal',
                            securityEvents:[],
                            coins:p.coins||0,
                            totalXp:p.totalXp||0,
                            weeklyRankedPts:p.weeklyRankedPts||0,
                            weeklyRankedKey:p.weekKey||'',
                            tier:p.tier||0,
                            lvl:p.lvl||1,
                            season:p.season||1,
                            tasksCompleted:p.tasksCompleted||0,
                            currentStreak:p.streak||0,
                            activeBoosters:[],
                            activityLog:[],
                            isBanned:isBannedUser(fbUsername),
                            source:'firebase',
                        });
                    });
                }

                allAccounts.sort((a,b)=>b.coins-a.coins);

                const filtered=allAccounts.filter(a=>{
                    if(!modSearch)return true;
                    const q=modSearch.toLowerCase();
                    return a.username.toLowerCase().includes(q)||a.email.toLowerCase().includes(q);
                });

                // Load full activity log for viewing user
                const viewingUserData=(()=>{
                    if(!modViewingUser)return null;
                    try{
                        const raw=localStorage.getItem(`user-${modViewingUser}-data`);
                        if(!raw)return null;
                        return JSON.parse(raw);
                    }catch(e){return null;}
                })();
                const viewingUserLog=viewingUserData?(viewingUserData.activityLog||[]):[];
                // Group entries by type for summary
                const logTypeCounts=viewingUserLog.reduce((acc,e)=>{acc[e.type]=(acc[e.type]||0)+1;return acc;},{});

                return(
                    <div style={{minHeight:'100vh',background:'#050a0f',color:'#e5e7eb',fontFamily:'monospace',fontSize:'0.85rem'}}>
                        {/* ── MOD DIALOG OVERLAY (inline prompt/confirm/info) ── */}
                        {modDialog&&(
                            <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.85)',zIndex:99999,display:'flex',alignItems:'center',justifyContent:'center',padding:'1rem'}}>
                                <div style={{background:'#111827',border:'2px solid #ef4444',borderRadius:'12px',padding:'1.5rem',minWidth:'320px',maxWidth:'500px',width:'100%',boxShadow:'0 25px 50px rgba(0,0,0,0.9)'}}>
                                    <p style={{color:'#f9fafb',fontSize:'0.95rem',lineHeight:'1.6',whiteSpace:'pre-line',marginBottom:'1rem',fontFamily:'monospace'}}>{modDialog.message}</p>
                                    {modDialog.type==='prompt'&&(
                                        <input autoFocus
                                            defaultValue={modDialog.inputDefault}
                                            onChange={e=>setModDialog(prev=>prev?{...prev,inputValue:e.target.value}:null)}
                                            onKeyDown={e=>{if(e.key==='Enter')modDialog.onOk(modDialog.inputValue);if(e.key==='Escape'&&modDialog.onCancel)modDialog.onCancel();}}
                                            style={{width:'100%',background:'#1f2937',color:'#f9fafb',border:'1px solid #ef4444',borderRadius:'8px',padding:'0.5rem 0.75rem',fontSize:'1rem',marginBottom:'1rem',outline:'none',boxSizing:'border-box',fontFamily:'monospace'}}
                                        />
                                    )}
                                    <div style={{display:'flex',gap:'0.75rem',justifyContent:'flex-end'}}>
                                        {(modDialog.type==='confirm'||modDialog.type==='prompt')&&(
                                            <button onClick={()=>modDialog.onCancel&&modDialog.onCancel()} style={{background:'#374151',color:'#d1d5db',border:'1px solid #6b7280',borderRadius:'8px',padding:'0.5rem 1.25rem',cursor:'pointer',fontWeight:'bold',fontFamily:'monospace'}}>Cancel</button>
                                        )}
                                        <button onClick={()=>modDialog.type==='prompt'?modDialog.onOk(modDialog.inputValue):modDialog.onOk()} style={{background:modDialog.type==='confirm'?'#dc2626':'#2563eb',color:'white',border:'none',borderRadius:'8px',padding:'0.5rem 1.25rem',cursor:'pointer',fontWeight:'bold',fontFamily:'monospace'}}>{modDialog.type==='confirm'?'Confirm':'OK'}</button>
                                    </div>
                                </div>
                            </div>
                        )}
                        <div style={{maxWidth:'1200px',margin:'0 auto',padding:'1.5rem'}}>
                            {/* Header */}
                            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1.5rem',borderBottom:'2px solid #ef4444',paddingBottom:'1rem'}}>
                                <div>
                                    <h1 style={{fontSize:'1.75rem',color:'#ef4444',fontWeight:'900',margin:0}}>🔐 PIVT MODERATOR CONSOLE</h1>
                                    <p style={{color:'#6b7280',fontSize:'0.75rem',margin:'0.25rem 0 0'}}>
                                        {allAccounts.length} accounts ({allAccounts.filter(a=>a.source==='local').length} local{FB.isReady()?`, ${allAccounts.filter(a=>a.source==='firebase').length} from Firebase`:''})
                                        {!FB.isReady()&&<span style={{color:'#f59e0b'}}> · Firebase offline — only showing local accounts</span>}
                                    </p>
                                </div>
                                <div style={{display:'flex',gap:'0.5rem',alignItems:'center'}}>
                                    {FB.isReady()&&<button onClick={()=>FB.getAllProfiles().then(p=>{if(p&&typeof p==='object'){setModFbProfiles(p);modRefresh();}})} style={{background:'#1f2937',color:'#60a5fa',border:'1px solid #374151',padding:'0.5rem 0.75rem',borderRadius:'8px',cursor:'pointer',fontWeight:'bold',fontSize:'0.8rem'}}>🔄 Refresh</button>}
                                    <button onClick={()=>modRefresh()} style={{background:'#1f2937',color:'#34d399',border:'1px solid #374151',padding:'0.5rem 0.75rem',borderRadius:'8px',cursor:'pointer',fontWeight:'bold',fontSize:'0.8rem'}}>⟳ Reload Accounts</button>
                                    <button onClick={()=>{addModLog('MOD_LOGOUT','Moderator logged out');setUser(null);setIsMod(false);setModViewingUser(null);setModFbProfiles({});setAuthMode('welcome');}} style={{background:'#374151',color:'white',border:'1px solid #6b7280',padding:'0.5rem 1rem',borderRadius:'8px',cursor:'pointer',fontWeight:'bold'}}>⬅ Logout</button>
                                </div>
                            </div>

                            {/* Tab bar */}
                            <div style={{display:'flex',gap:'0.5rem',marginBottom:'1.5rem',flexWrap:'wrap'}}>
                                {[['accounts','👥 Accounts'],['activity','🔍 Activity Viewer'],['suspicious','🚨 Suspicious'],['ranked','⚔️ Ranked'],['events','⏰ Events'],['debug','🐛 Debug'],['log','📋 Mod Log']].map(([t,l])=>(
                                    <button key={t} onClick={()=>setModTab(t)} style={{padding:'0.5rem 1rem',borderRadius:'8px',border:`1px solid ${modTab===t?'#ef4444':'#374151'}`,background:modTab===t?'#7f1d1d':'#1f2937',color:modTab===t?'#fca5a5':'#9ca3af',cursor:'pointer',fontWeight:modTab===t?'bold':'normal'}}>
                                        {l}{t==='suspicious'&&allAccounts.filter(a=>a.coins>200000||a.securityEvents.length>0).length>0?` (${allAccounts.filter(a=>a.coins>200000||a.securityEvents.length>0).length})`:''}{t==='log'&&modLog.length>0?` (${modLog.length})`:''}{t==='activity'&&modViewingUser?` — ${modViewingUser}`:''}
                                    </button>
                                ))}
                            </div>

                            {/* ACCOUNTS TAB */}
                            {modTab==='accounts'&&(
                                <div>
                                    <div style={{display:'flex',gap:'0.75rem',marginBottom:'1rem',flexWrap:'wrap',alignItems:'center'}}>
                                        <input type="text" placeholder="Search username or email…" value={modSearch} onChange={e=>setModSearch(e.target.value)} style={{flex:1,minWidth:'200px',background:'#1f2937',border:'1px solid #374151',color:'white',padding:'0.5rem 0.75rem',borderRadius:'8px',fontFamily:'monospace'}}/>
                                        <span style={{color:'#6b7280',fontSize:'0.8rem'}}>{filtered.length} / {allAccounts.length} shown</span>
                                    </div>
                                    <div style={{maxHeight:'65vh',overflowY:'auto'}}>
                                        {filtered.length===0?<p style={{color:'#6b7280',padding:'2rem',textAlign:'center'}}>No accounts found.</p>:filtered.map(a=>(
                                            <div key={a.key} style={{display:'flex',flexDirection:'column',padding:'0.875rem',background:'#111827',borderRadius:'10px',marginBottom:'0.625rem',borderLeft:`3px solid ${a.isBanned?'#ef4444':a.status==='suspended'?'#f59e0b':a.coins>200000?'#a855f7':'#10b981'}`}}>
                                                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'0.5rem',flexWrap:'wrap'}}>
                                                    <div style={{flex:1}}>
                                                        <div style={{display:'flex',alignItems:'center',gap:'0.5rem',flexWrap:'wrap',marginBottom:'0.25rem'}}>
                                                            <span style={{fontWeight:'bold',color:'white',fontSize:'1rem'}}>{a.username}</span>
                                                            {a.source==='firebase'&&<span style={{padding:'0.15rem 0.5rem',borderRadius:'999px',fontSize:'0.65rem',fontWeight:'bold',background:'#1e3a5f',color:'#60a5fa',border:'1px solid #3b82f660'}}>☁️ Firebase</span>}
                                                            {a.isBanned&&<span style={{padding:'0.15rem 0.5rem',borderRadius:'999px',fontSize:'0.65rem',fontWeight:'bold',background:'#ef444420',color:'#ef4444',border:'1px solid #ef444460'}}>BANNED</span>}
                                                            {a.status==='suspended'&&<span style={{padding:'0.15rem 0.5rem',borderRadius:'999px',fontSize:'0.65rem',fontWeight:'bold',background:'#f59e0b20',color:'#f59e0b',border:'1px solid #f59e0b60'}}>SUSPENDED</span>}
                                                            {a.coins>200000&&<span style={{padding:'0.15rem 0.5rem',borderRadius:'999px',fontSize:'0.65rem',fontWeight:'bold',background:'#a855f720',color:'#a855f7',border:'1px solid #a855f760'}}>HIGH COINS ⚠️</span>}
                                                            {a.securityEvents.length>2&&<span style={{padding:'0.15rem 0.5rem',borderRadius:'999px',fontSize:'0.65rem',fontWeight:'bold',background:'#f9731620',color:'#f97316',border:'1px solid #f9731660'}}>SEC EVENTS ({a.securityEvents.length})</span>}
                                                        </div>
                                                        <p style={{color:'#9ca3af',fontSize:'0.75rem',margin:'0 0 0.375rem'}}>📧 {a.email} · 🔑 {a.loginCount} logins · 🕐 Last: {a.lastLogin?new Date(a.lastLogin).toLocaleString():'-'}</p>
                                                        <div style={{display:'flex',gap:'1rem',flexWrap:'wrap',fontSize:'0.78rem'}}>
                                                            <span style={{color:'#fbbf24'}}>💰 {(a.coins||0).toLocaleString()} coins</span>
                                                            <span style={{color:'#818cf8'}}>⚡ {(a.totalXp||0).toLocaleString()} XP</span>
                                                            <span style={{color:'#34d399'}}>📋 {a.tasksCompleted} tasks</span>
                                                            <span style={{color:'#f472b6'}}>🔥 {a.currentStreak}d streak</span>
                                                            <span style={{color:'#60a5fa'}}>Tier {a.tier} · Lv{a.lvl} · S{a.season}</span>
                                                            {a.activeBoosters.length>0&&<span style={{color:'#c084fc'}}>🚀 {a.activeBoosters.length} active boost(s): {a.activeBoosters.map(b=>`${b.boost}x`).join(', ')}</span>}
                                                        </div>
                                                    </div>
                                                    <div style={{display:'flex',gap:'0.375rem',flexWrap:'wrap',alignItems:'flex-start'}}>
                                                        <button onClick={()=>modOpenActivity(a)} style={{background:'#1d4ed8',color:'white',border:'none',padding:'0.3rem 0.6rem',borderRadius:'6px',cursor:'pointer',fontWeight:'bold',fontSize:'0.7rem'}}>🔍 Activity</button>
                                                        <button onClick={()=>modResetCoins(a)} style={{background:'#d97706',color:'white',border:'none',padding:'0.3rem 0.6rem',borderRadius:'6px',cursor:'pointer',fontWeight:'bold',fontSize:'0.7rem'}}>💰 Coins</button>
                                                        <button onClick={()=>modSetXp(a)} style={{background:'#0369a1',color:'white',border:'none',padding:'0.3rem 0.6rem',borderRadius:'6px',cursor:'pointer',fontWeight:'bold',fontSize:'0.7rem'}}>⚡ XP</button>
                                                        <button onClick={()=>modSetTier(a)} style={{background:'#5b21b6',color:'white',border:'none',padding:'0.3rem 0.6rem',borderRadius:'6px',cursor:'pointer',fontWeight:'bold',fontSize:'0.7rem'}}>🏆 Tier</button>
                                                        <button onClick={()=>modSetRankedPts(a)} style={{background:'#065f46',color:'white',border:'none',padding:'0.3rem 0.6rem',borderRadius:'6px',cursor:'pointer',fontWeight:'bold',fontSize:'0.7rem'}}>⚔️ Ranked</button>
                                                        <button onClick={()=>modWipeRankedPts(a)} style={{background:'#164e63',color:'white',border:'none',padding:'0.3rem 0.6rem',borderRadius:'6px',cursor:'pointer',fontWeight:'bold',fontSize:'0.7rem'}}>🗑 Ranked</button>
                                                        <button onClick={()=>modWipeBoosts(a)} style={{background:'#7c3aed',color:'white',border:'none',padding:'0.3rem 0.6rem',borderRadius:'6px',cursor:'pointer',fontWeight:'bold',fontSize:'0.7rem'}}>🚀 Boosts</button>
                                                        <button onClick={()=>modResetLoginLock(a)} style={{background:'#166534',color:'white',border:'none',padding:'0.3rem 0.6rem',borderRadius:'6px',cursor:'pointer',fontWeight:'bold',fontSize:'0.7rem'}}>🔓 Unlock</button>
                                                        {a.status==='suspended'
                                                            ?<button onClick={()=>modUnsuspendUser(a)} style={{background:'#059669',color:'white',border:'none',padding:'0.3rem 0.6rem',borderRadius:'6px',cursor:'pointer',fontWeight:'bold',fontSize:'0.7rem'}}>✅ Unsuspend</button>
                                                            :<button onClick={()=>modSuspendUser(a)} style={{background:'#b45309',color:'white',border:'none',padding:'0.3rem 0.6rem',borderRadius:'6px',cursor:'pointer',fontWeight:'bold',fontSize:'0.7rem'}}>⛔ Suspend</button>
                                                        }
                                                        {a.isBanned
                                                            ?<button onClick={()=>modUnbanUser(a.username)} style={{background:'#065f46',color:'white',border:'none',padding:'0.3rem 0.6rem',borderRadius:'6px',cursor:'pointer',fontWeight:'bold',fontSize:'0.7rem'}}>✅ Unban</button>
                                                            :<button onClick={()=>modBanUser(a)} style={{background:'#7f1d1d',color:'white',border:'none',padding:'0.3rem 0.6rem',borderRadius:'6px',cursor:'pointer',fontWeight:'bold',fontSize:'0.7rem'}}>🚫 Ban+Wipe</button>
                                                        }
                                                        <button onClick={()=>modDeleteUser(a)} style={{background:'#ef4444',color:'white',border:'none',padding:'0.3rem 0.6rem',borderRadius:'6px',cursor:'pointer',fontWeight:'bold',fontSize:'0.7rem'}}>🗑 Delete</button>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* ACTIVITY VIEWER TAB */}
                            {modTab==='activity'&&(
                                <div>
                                    {!modViewingUser?(
                                        <div style={{textAlign:'center',padding:'3rem',color:'#6b7280'}}>
                                            <p style={{fontSize:'1.1rem',marginBottom:'0.5rem'}}>No user selected.</p>
                                            <p style={{fontSize:'0.8rem'}}>Click <strong style={{color:'#60a5fa'}}>🔍 Activity</strong> next to any user in the Accounts tab.</p>
                                        </div>
                                    ):(
                                        <div>
                                            {/* Header with user info */}
                                            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1rem',padding:'0.875rem',background:'#1f2937',borderRadius:'10px',border:'1px solid #374151'}}>
                                                <div>
                                                    <p style={{fontWeight:'bold',color:'#f9a8d4',fontSize:'1.05rem',margin:0}}>🔍 Inspecting: {modViewingUser}</p>
                                                    <p style={{color:'#9ca3af',fontSize:'0.75rem',margin:'0.25rem 0 0'}}>{viewingUserLog.length} total activity entries</p>
                                                </div>
                                                <button onClick={()=>{setModViewingUser(null);setModTab('accounts');}} style={{background:'#374151',color:'white',border:'none',padding:'0.4rem 0.8rem',borderRadius:'6px',cursor:'pointer',fontSize:'0.8rem'}}>← Back</button>
                                            </div>

                                            {/* Type summary with bulk-delete */}
                                            <div style={{marginBottom:'1rem',padding:'0.875rem',background:'#111827',borderRadius:'10px',border:'1px solid #1f2937'}}>
                                                <p style={{color:'#9ca3af',fontSize:'0.75rem',fontWeight:'bold',marginBottom:'0.5rem',textTransform:'uppercase',letterSpacing:'0.05em'}}>Activity Type Breakdown (click to bulk-delete)</p>
                                                <div style={{display:'flex',flexWrap:'wrap',gap:'0.375rem'}}>
                                                    {Object.entries(logTypeCounts).sort((a,b)=>b[1]-a[1]).map(([type,count])=>(
                                                        <button key={type} onClick={()=>modDeleteActivityByType(modViewingUser,type)} style={{padding:'0.25rem 0.6rem',borderRadius:'999px',fontSize:'0.7rem',fontWeight:'bold',background:'#1f293780',border:'1px solid #374151',color:'#9ca3af',cursor:'pointer'}} title={`Delete all ${count} "${type}" entries`}>
                                                            {type} ({count}) 🗑
                                                        </button>
                                                    ))}
                                                    {Object.keys(logTypeCounts).length===0&&<p style={{color:'#6b7280',fontSize:'0.8rem'}}>No activities logged.</p>}
                                                </div>
                                            </div>

                                            {/* Full activity log with per-entry delete */}
                                            <div style={{maxHeight:'60vh',overflowY:'auto'}}>
                                                {viewingUserLog.length===0?(
                                                    <p style={{color:'#6b7280',textAlign:'center',padding:'2rem'}}>No activity entries found.</p>
                                                ):viewingUserLog.map((e,i)=>{
                                                    const isHighValue=e.details?.coins>500||e.details?.xp>1000;
                                                    const isSuspicious=e.type==='wheel_won'||(e.details?.coins>1000)||(e.type==='goal_completed'&&e.details?.coins>800)||(e.type==='task_completed'&&e.details?.coins>1500);
                                                    return(
                                                        <div key={i} style={{display:'flex',alignItems:'flex-start',gap:'0.5rem',padding:'0.5rem 0.625rem',background:isSuspicious?'#1c0a0a':'#111827',borderRadius:'6px',marginBottom:'0.25rem',border:`1px solid ${isSuspicious?'#ef444430':'#1f2937'}`}}>
                                                            <div style={{flex:1,minWidth:0}}>

                            width: Math.random() * 3 + 'px',
                            height: Math.random() * 3 + 'px',
                            top: Math.random() * 100 + '%',
                            left: Math.random() * 100 + '%',
                            '--duration': (Math.random() * 3 + 2) + 's',
                            animationDelay: Math.random() * 5 + 's'

                    {[...Array(3)].map((_, i) => (
                        <div key={i} className="rocket" style={{

            if(!user){
                return (
                    <div className={`auth-shell ui-shell ui-${uiProfile} adaptive-vh min-h-screen relative text-white flex items-center justify-center p-3 md:p-4 safe-pad overflow-hidden`} data-ui={uiProfile}>

                        <div className={`adaptive-card max-w-md w-full ${securityMode==='lockdown'?'animate-glitch-wave':securityMode==='hardened'?'animate-edit-shake':''}`} key={authShakeKey}>

                            {authMode==='welcome'&&(
                                <div className="text-center animate-fadeIn">
                                    <div className="text-8xl mb-6 animate-float animate-aurora-spin">🎮</div>
                                    <h1 className="adaptive-title text-4xl md:text-5xl font-bold mb-4 bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-400 bg-clip-text text-transparent animate-text-sheen">P.I.V.T</h1>
                                    <p className="text-gray-400 mb-8">Productivity • Innovation • Victory • Transformation</p>
                                    <div className="space-y-4 adaptive-stack">
                                        <button onClick={()=>setAuthMode('login')} className="w-full py-4 rounded-xl font-bold text-lg bg-gradient-to-r from-cyan-500 to-blue-500 hover:opacity-90 transition-all transform hover:scale-105 shadow-lg">Login</button>
                                        <button onClick={()=>setAuthMode('signup')} className="w-full py-4 rounded-xl font-bold text-lg bg-gradient-to-r from-purple-500 to-pink-500 hover:opacity-90 transition-all transform hover:scale-105 shadow-lg">Create Account</button>
                                        
                                        
                                    </div>
                                    <div className="mt-8 grid grid-cols-2 sm:grid-cols-4 gap-3 opacity-70 adaptive-grid">
                                        {tiers.filter(t=>t.season===1).slice(0,4).map((t,i)=><div key={i} className="text-center animate-quantum"><div className="text-2xl mb-1">{t.icon}</div><div className="text-xs text-cyan-300">{t.name}</div></div>)}
                                    </div>
                                    <p className="text-[11px] text-gray-500 mt-3">Season 1 preview only — other seasons unlock in-game.</p><p className="text-[10px] text-gray-600 mt-1">Security note: browser apps use client code; anti-cheat protections are active and monitored.</p>
                                </div>
                            )}
                            {authMode==='login'&&(
                                <div className="bg-gray-800 rounded-2xl p-8 border border-gray-700 animate-slideUp animate-neon-pulse animate-card-pop">

                                    {authErr&&<div className="bg-red-500 bg-opacity-20 border border-red-500 rounded-lg p-3 mb-4 text-red-200 text-sm">{authErr}</div>}
                                    <div className="space-y-4">
                                        <div><label className="block text-sm text-gray-400 mb-2">Username or Email</label><div className="relative"><div className="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-500"><User/></div><input type="text" value={authForm.username} onChange={(e)=>setAuthForm({...authForm,username:e.target.value})} onKeyPress={(e)=>e.key==='Enter'&&login()} className="w-full bg-gray-700 text-white pl-12 pr-4 py-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-500" placeholder="Username or email" autoComplete="username"/></div></div>

                                        <div className="flex items-center justify-between">
                                            <label className="flex items-center gap-2 cursor-pointer select-none">
                                                <input type="checkbox" checked={rememberMe} onChange={e=>{setRememberMe(e.target.checked);localStorage.setItem('pivt-remember-me',String(e.target.checked));}} className="w-4 h-4 accent-cyan-500"/>
                                                <span className="text-sm text-gray-300">Remember me</span>
                                            </label>
                                            <button onClick={()=>{setAuthMode('forgot');setAuthErr('');setAuthForm(prev=>({...prev,password:'',confirmPassword:'',otp:''}))}} className="text-cyan-400 hover:text-cyan-300 text-sm">Forgot Password?</button>
                                        </div>
                                        <button onClick={login} className="w-full py-4 rounded-xl font-bold text-lg bg-gradient-to-r from-cyan-500 to-blue-500 hover:opacity-90 transition-all transform hover:scale-105 shadow-lg">Login</button>
                                        <div className="text-center text-gray-500 text-sm">Don't have an account? <button onClick={()=>{setAuthMode('signup');setAuthErr('');setAuthForm({username:'',email:'',password:'',confirmPassword:'',otp:''})}} className="text-purple-400 hover:text-purple-300">Sign Up</button></div>
                                    </div>
                                </div>
                            )}
                            {authMode==='signup'&&(
                                <div className="bg-gray-800 rounded-2xl p-8 border border-gray-700 animate-slideUp animate-neon-pulse animate-card-pop">

                                        <div><label className="block text-sm text-gray-400 mb-2">Username</label><div className="relative"><div className="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-500"><User/></div><input type="text" value={authForm.username} onChange={(e)=>setAuthForm({...authForm,username:e.target.value})} className="w-full bg-gray-700 text-white pl-12 pr-4 py-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="Choose username"/></div><button onClick={chooseRandomUsername} className="mt-2 px-3 py-2 bg-indigo-700 hover:bg-indigo-600 rounded-lg text-xs font-bold">🎲 Random Username ({RANDOM_USERNAME_POOL_SIZE.toLocaleString()}+ pool)</button></div>

                                        <div><label className="block text-sm text-gray-400 mb-2">Confirm Password</label><div className="relative"><div className="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-500"><Lock/></div><input type={showPass?'text':'password'} value={authForm.confirmPassword} onChange={(e)=>setAuthForm({...authForm,confirmPassword:e.target.value})} onKeyPress={(e)=>e.key==='Enter'&&signup()} className="w-full bg-gray-700 text-white pl-12 pr-4 py-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="Confirm password"/></div></div>
                                        <button onClick={signup} className="w-full py-4 rounded-xl font-bold text-lg bg-gradient-to-r from-purple-500 to-pink-500 hover:opacity-90 transition-all transform hover:scale-105 shadow-lg">Create Account</button>

                                    </div>
                                </div>
                            )}
                            {authMode==='forgot'&&(
                                <div className="bg-gray-800 rounded-2xl p-8 border border-gray-700 animate-slideUp animate-neon-pulse animate-card-pop">
                                    <h2 className="text-3xl font-bold mb-2 text-center">Reset Password</h2>
                                    <p className="text-center text-gray-400 text-sm mb-6">Enter the email you used to sign up. We'll send you a 6-digit code to reset your password.</p>
                                    {authErr&&<div className="bg-red-500 bg-opacity-20 border border-red-500 rounded-lg p-3 mb-4 text-red-200 text-sm">{authErr}</div>}
                                    {resetMsg&&<div className="bg-green-500 bg-opacity-20 border border-green-500 rounded-lg p-3 mb-4 text-green-200 text-sm">{resetMsg}</div>}
                                    {forgotOtpMeta&&<div className="bg-yellow-500 bg-opacity-10 border border-yellow-500 rounded-lg p-3 mb-4 text-yellow-200 text-xs">⏱️ OTP expires at {new Date(forgotOtpMeta.expires).toLocaleTimeString()} • {APP_CONFIG.otp.maxAttempts-(forgotOtpMeta.attempts||0)} attempt(s) remaining</div>}
                                    {otpModal&&(
                                        <div className="mb-4 bg-yellow-500 bg-opacity-10 border border-yellow-500 rounded-2xl p-4 text-center">
                                            <p className="text-yellow-300 font-bold text-sm mb-1">📧 OTP Sent</p>

                                            <p className="text-yellow-300 text-xs mt-2">⏱️ Expires at {new Date(otpModal.expires).toLocaleTimeString()}</p>

                                        </div>
                                    )}
